<!doctype html><html lang="en"><head><meta charset="utf-8"><title>KharchaMitra Local</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f4f6f2;--cd:#fff;--tx:#1b2a21;--mu:#69786e;--ac:#1f7a4d;--ex:#cf4f36;--bd:#e1e7df;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#111a14;--cd:#1a251e;--tx:#e8efe9;--mu:#94a59a;--ac:#4cc489;--ex:#ef7d63;--bd:#2a382f;color-scheme:dark}}
:root[data-theme=dark]{--bg:#111a14;--cd:#1a251e;--tx:#e8efe9;--mu:#94a59a;--ac:#4cc489;--ex:#ef7d63;--bd:#2a382f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans Devanagari',sans-serif}
#app{max-width:760px;margin:0 auto;padding:14px 14px 96px}
.top,.row,.li,.mo{display:flex;align-items:center;gap:8px}.sp{flex:1}.gr{flex:1;min-width:0}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.g3 .card{margin:0;text-align:center}.g3 b{font-size:16px}
small,.mu{color:var(--mu)}h4{margin:14px 0 4px;color:var(--mu);font-size:13px}
input,select,textarea,button{font:inherit;color:var(--tx)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);margin:4px 0}
button,.btn{border:1px solid var(--bd);background:var(--cd);border-radius:10px;padding:9px 12px;cursor:pointer;font:inherit;color:var(--tx)}
.p{background:var(--ac);color:#fff;border-color:var(--ac)}button.on{border-color:var(--ac);background:var(--ac);color:#fff}
.x{border:0;background:none;color:var(--mu);font-size:20px;padding:2px 8px}.ex{color:var(--ex)}.in{color:var(--ac)}
.ic{font-size:22px}.bar{height:8px;border-radius:6px;background:var(--ac);opacity:.85;margin-top:3px}
.seg{display:flex;gap:6px}.seg button{flex:1}.li{padding:8px 0;border-bottom:1px solid var(--bd)}
.ri{display:grid;grid-template-columns:1fr 78px 1fr auto;gap:4px;align-items:center}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:8px;font-size:18px}nav small{display:block;font-size:11px}nav .on{color:var(--ac);background:none}
#ts{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none}
#mic.on{background:var(--ex);color:#fff;border-color:var(--ex)}
.pie{display:block;width:min(270px,74vw);margin:8px auto;color:var(--tx)}.pie path,.pie circle{cursor:pointer}.sw{width:12px;height:12px;border-radius:3px;flex:none}.chip{display:inline-block;padding:5px 11px;margin:4px 4px 0 0;border:1px solid var(--bd);border-radius:14px;cursor:pointer;font-size:13px}</style><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script></head><body><div id="app"></div>
<nav><button data-a="tab" data-v="home">🏠<small>Home</small></button><button data-a="tab" data-v="add">➕<small>Add</small></button><button data-a="tab" data-v="items">🔎<small>Items</small></button><button data-a="tab" data-v="hist">🧾<small>History</small></button></nav>
<div id="ts"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const C=[
['groc','Groceries','किराना','🛒','ex','saffola fortune dhara sundrop gemini sweekar helicopter engine gopala gokul tel sooji suji rawa chana chole matar rajma moong masoor urad toor arhar mustard sarson refined bread flour wheat noodles pasta oats chips chocolate juice soda cola cookies pulses lentil atta aata chawal rice dal daal chini cheeni sugar namak salt tel oil ghee masala mirch haldi besan maida suji poha biscuit maggi chai tea sabun आटा चावल दाल चीनी नमक तेल मसाला'],
['veg','Veg & Fruits','सब्ज़ी-फल','🥬','ex','vegetable vegetables carrot cabbage spinach chilli garlic ginger mango orange grapes sabzi sabji sabzee pyaaz pyaj onion aloo potato tamatar tomato gobhi bhindi palak adrak nimbu fruit seb apple kela banana aam angoor सब्जी प्याज आलू टमाटर फल'],
['dairy','Dairy','दूध-डेयरी','🥛','ex','doodh dudh milk dahi curd paneer anda egg ande makhan butter lassi amul दूध दही पनीर'],
['eat','Eating Out','बाहर खाना','🍽️','ex','restaurant hotel dhaba pizza burger zomato swiggy samosa chaat momo cafe thali biryani'],
['trn','Transport','यात्रा','🚌','ex','petrol diesel fuel auto cab ola uber bus train ticket metro parking toll fastag पेट्रोल डीज़ल'],
['util','Utilities','बिल-रिचार्ज','💡','ex','bijli electricity bill recharge wifi internet gas cylinder pani water dth jio airtel बिजली रिचार्ज'],
['house','Housing','घर','🏠','ex','rent kiraya maintenance repair plumber mistri किराया'],
['hlth','Health','स्वास्थ्य','💊','ex','dawai dawa medicine medical doctor dr test hospital chemist दवा दवाई'],
['edu','Education','शिक्षा','📚','ex','fees fee school tuition book kitab copy pen stationery'],
['shop','Shopping','खरीदारी','🛍️','ex','scrub steel detergent surf broom phenyl mop dishwash vim harpic kapde kapda cloth shirt jeans shoes joota mobile amazon flipkart कपड़े'],
['care','Personal Care','सौंदर्य','🧴','ex','toothpaste toothbrush lotion deodorant facewash tissue salon shampoo soap cream haircut parlour'],
['fun','Entertainment','मनोरंजन','🎬','ex','movie film netflix game trip'],
['gift','Gifts & Festival','त्योहार','🎁','ex','gift tohfa festival diwali puja mandir daan donation'],
['fin','Finance','EMI/बीमा','🏦','ex','emi loan insurance bima sip lic'],
['hh','Household','घरेलू सामान','🧽','ex','detergent surf phenyl lizol harpic broom jhadu mop pocha dishwash vim matchbox machis candle agarbatti naphthalene mosquito'],
['meat','Meat & Fish','मांस-मछली','🍗','ex','chicken murga mutton fish machhli maach prawn'],
['oth','Other','अन्य','📦','ex',''],
['sal','Salary','वेतन','💼','in','salary vetan tankhwah pagar वेतन तनख्वाह'],
['biz','Business','व्यापार','🏪','in','bikri dukaan business sale कमाई'],
['oi','Other income','अन्य आय','➕','in','']];
const CAT=Object.fromEntries(C.map(([id,en,hi,ic,ty,k])=>[id,{id,en,hi,ic,ty,k:k.split(' ').filter(Boolean)}]));
const cc=x=>CAT[x.cat]||CAT.oth;
const S={tx:[],m:'',tab:'home',ty:'ex',q:'',hi:false,pick:0,cd:'',pv:'c',iq:'',iqs:'',ir:'m'};
let R=null,busyMsg='',SM=null,D=null,DL={save:o=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([o.data]));a.download=o.filename;a.click();return Promise.resolve()}},coll=null,listening=false;
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const rs=p=>'₹'+(p/100).toLocaleString('en-IN',{maximumFractionDigits:2});
const lab=c=>S.hi?c.hi:c.en;S.m=today().slice(0,7);
const lev=(a,b)=>{let p=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let c=[i];for(let j=1;j<=b.length;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[b.length]};
const dn=s=>s.replace(/[०-९]/g,d=>'०१२३४५६७८९'.indexOf(d));
function guess(t,ty){const w=String(t).toLowerCase().split(/[^\p{L}\p{M}]+/u).filter(x=>x.length>1);let b=ty==='in'?'oi':'oth',bs=9;for(const c of Object.values(CAT)){if(c.ty!==ty)continue;for(const k of c.k)for(const x of w){const l=k.length>5?2:k.length>3?1:0,d=k===x?0:lev(k,x);if(d<=l&&d<bs){bs=d;b=c.id}}}return b}
function localParse(t){const items=[];for(const g of dn(t).split(/[,\n;]+|\s+(?:aur|and|और)\s+/i)){const m=g.match(/\d+(?:\.\d+)?/g);if(!m)continue;const ty=/salary|vetan|aayi|aaya|mila|income|वेतन|कमाई/i.test(g)?'in':'ex';const name=g.replace(/\d+(?:\.\d+)?/g,' ').replace(/\b(rs|rupees?|rupaye|rupay|ka|ki|ke|ko|diye|dala|liya)\b|₹/gi,' ').replace(/\s+/g,' ').trim();items.push({name:name||'Entry',amount:+m[m.length-1],cat:guess(g,ty),type:ty})}return{merchant:'',date:'',items}}
const toast=m=>{const t=$('#ts');t.textContent=m;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,2600)};
const cache=()=>{try{localStorage.setItem('km_tx',JSON.stringify(S.tx))}catch(e){}};
try{S.tx=JSON.parse(localStorage.getItem('km_tx')||'[]');S.hi=localStorage.getItem('km_hi')==='1'}catch(e){}
function put(t){if(t.bill&&S.img&&t.bill===S.bid){t.img=1;idbPut(t.bill,S.img)}S.tx=S.tx.filter(x=>x.id!==t.id).concat(t);cache()}
function rm(id){S.tx=S.tx.filter(x=>x.id!==id);cache();if(coll)coll.doc(id).delete().catch(()=>{})}
const mk=o=>({id:uid(),t:o.type,amt:Math.round(o.amount*100),cat:o.cat,note:o.note||'',it:o.item||itemKey(o.note),ds:o.desc||'',mer:o.mer||'',d:o.date||today(),pay:o.pay||'',bill:o.bill||(S.img?(S.bid=S.bid||uid()):''),src:o.src||'manual',ts:Date.now()});
const mtx=()=>S.tx.filter(x=>x.d.startsWith(S.m)).sort((a,b)=>b.d.localeCompare(a.d)||b.ts-a.ts);
const sum=(L,t)=>L.filter(x=>x.t===t).reduce((s,x)=>s+x.amt,0);
const row=x=>{const c=cc(x);return `<div class="li"><span class="ic">${c.ic}</span><div class="gr"><div>${esc(x.note||lab(c))}</div><small>${x.ds?esc(x.ds)+' · ':''}${esc(x.mer?x.mer+' · ':'')}${lab(c)}${x.pay?' · '+esc(x.pay):''}</small></div>${x.img?`<button class='x' data-a='vi' data-v='${x.bill}'>🧾</button>`:''}<b class="${x.t}">${x.t==='in'?'+':'−'}${rs(x.amt)}</b><button class="x" data-a="ed" data-v="${x.id}">✏️</button></div>`};
const opts=(sel,ty)=>Object.values(CAT).filter(c=>c.ty===ty).map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${c.ic} ${esc(lab(c))}</option>`).join('');
const head=()=>{const[y,m]=S.m.split('-').map(Number);return `<div class="top"><b style="font-size:18px">🪙 KharchaMitra</b><span class="sp"></span><button data-a="lang">${S.hi?'EN':'हिं'}</button><small>📱 Saved on this device</small></div>`+(S.tab==='add'?'':`<div class="mo" style="justify-content:center;margin:8px 0"><button data-a="mo" data-v="-1">‹</button><b>${new Date(y,m-1).toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</b><button data-a="mo" data-v="1">›</button></div>`)};
const PAL=['#2e8b6a','#e0783c','#4a8fd9','#c0527a','#8e6bd1','#d9b13b','#3aa6a0','#cf5a47','#7a9a2a','#7a8ba3','#b5651d','#a64ca6'],IKM=new Map();
function itemKey(n){n=String(n||'');let v=IKM.get(n);if(v)return v;const t=n.replace(/×\s*\d+/g,' ').replace(new RegExp(SIZE.source,'gi'),' ').toLowerCase().replace(/[^\p{L}\p{M}\s]/gu,' ').split(/\s+/).filter(w=>w.length>1),r=t.length?resolvePhrase(t):null;v=r?ITEMS[r.i].n:(tc(t.join(' '))||'Other');IKM.set(n,v);return v}
const itemOf=x=>x.it||itemKey(x.note);
function catGuess(t,ty){if(ty==='ex'){const w=String(t).toLowerCase().replace(/[^\p{L}\p{M}\s]/gu,' ').split(/\s+/).filter(w=>w.length>1),r=w.length?resolvePhrase(w):null;if(r&&CAT[ITEMS[r.i].c])return ITEMS[r.i].c}return guess(t,ty)}
function arc(a0,a1,r0,r1){const P=(a,r)=>[(Math.cos(a)*r).toFixed(4),(Math.sin(a)*r).toFixed(4)],l=a1-a0>Math.PI?1:0;return`M${P(a0,r1)}A${r1} ${r1} 0 ${l} 1 ${P(a1,r1)}L${P(a1,r0)}A${r0} ${r0} 0 ${l} 0 ${P(a0,r0)}Z`}
function pie(parts,act){const tot=parts.reduce((s,p)=>s+p.v,0);if(!tot)return'<p class="mu">No expenses yet. Tap Add to start ✨</p>';let a=-Math.PI/2,h='';
parts.forEach(p=>{const f=p.v/tot,a1=a+f*2*Math.PI,at=p.k==='__o'?'':` data-a="${act}" data-v="${esc(p.k)}"`;h+=f>.9999?`<circle r=".775" fill="none" stroke="${p.c}" stroke-width=".45"${at}/>`:`<path d="${arc(a,a1,.55,1)}" fill="${p.c}"${at}/>`;a=a1});
return`<svg viewBox="-1.02 -1.02 2.04 2.04" class="pie">${h}<text y=".07" text-anchor="middle" font-size=".24" fill="currentColor">${rs(tot)}</text></svg>`+parts.map(p=>`<div class="li"${p.k==='__o'?'':` data-a="${act}" data-v="${esc(p.k)}" style="cursor:pointer"`}><span class="sw" style="background:${p.c}"></span><div class="gr">${esc(p.l)}</div><b>${rs(p.v)}</b><small style="width:44px;text-align:right">${(p.v/tot*100).toFixed(1)}%</small></div>`).join('')}
function grp(L,fn){const m={};L.forEach(x=>{const k=fn(x);m[k]=(m[k]||0)+x.amt});return Object.entries(m).map(([k,v])=>({k,v,l:k})).sort((a,b)=>b.v-a.v)}
function topN(P,n){const t=P.slice(0,n).map((p,i)=>({...p,c:PAL[i%PAL.length]})),r=P.slice(n).reduce((s,p)=>s+p.v,0);if(r>0)t.push({k:'__o',v:r,l:'Others ('+(P.length-n)+')',c:'#9aa5a0'});return t}
const cidx=id=>Math.max(0,Object.keys(CAT).indexOf(id));
function ask(m,y){const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:12;padding:16px';o.innerHTML=`<div class='card' data-a='no' style='max-width:420px;margin:0'><p style='margin:0 0 12px'>${esc(m)}</p><div class='row'><span class='sp'></span><button id='ano'>Cancel</button><button class='btn p' id='ayes' style='background:var(--ex);border-color:var(--ex)'>Yes, delete</button></div></div>`;document.body.appendChild(o);o.querySelector('#ano').onclick=()=>o.remove();o.querySelector('#ayes').onclick=()=>{o.remove();y()}}
function home(){const L=mtx(),inc=sum(L,'in'),ex=sum(L,'ex'),E=L.filter(x=>x.t==='ex');let body;
if(S.cd){const c=CAT[S.cd]||CAT.oth,I=E.filter(x=>x.cat===S.cd);body=`<div class="card"><div class="row"><button data-a="cb">‹ All</button><b>${c.ic} ${esc(lab(c))}</b><span class="sp"></span><b>${rs(sum(I,'ex'))}</b></div><small>Spending by item. Tap an item to see its history.</small>${pie(topN(grp(I,itemOf),8),'it')}</div>`}
else{const P=S.pv==='i'?topN(grp(E,itemOf),8):grp(E,x=>x.cat).map(p=>{const c=CAT[p.k]||CAT.oth;return{...p,l:c.ic+' '+lab(c),c:PAL[cidx(p.k)%PAL.length]}});
body=`<div class="card"><div class="seg"><button data-a="pv" data-v="c" class="${S.pv==='c'?'on':''}">By category</button><button data-a="pv" data-v="i" class="${S.pv==='i'?'on':''}">By item</button></div><small>${S.pv==='i'?'Top items. Tap one for its history.':'Tap a category to see its items.'}</small>${pie(P,S.pv==='i'?'it':'pc')}</div>`}
return`<div class="g3"><div class="card"><small>Income</small><br><b class="in">${rs(inc)}</b></div><div class="card"><small>Expense</small><br><b class="ex">${rs(ex)}</b></div><div class="card"><small>Balance</small><br><b>${rs(inc-ex)}</b></div></div>${body}<div class="card"><b>Recent</b>${L.slice(0,6).map(row).join('')||'<p class="mu">Nothing here</p>'}</div>`}
const qv=n=>{const m=String(n).match(SIZE);if(!m)return null;const v=parseFloat(m[1].replace(',','.')),u=m[2].toLowerCase();return(u==='ml'||u[0]==='l')?{k:'ml',v:u==='ml'?v:v*1000}:{k:'g',v:u[0]==='g'?v:v*1000}};
function suggest(q,pool){const t=q.toLowerCase().replace(/[^\p{L}\p{M}\s]/gu,' ').split(/\s+/).filter(Boolean);if(!t.length)return[];const s=t.join(' '),out=new Map(),keys=new Set(pool.map(itemOf)),add=(n,d)=>{const k=n.toLowerCase(),o=out.get(k);if(!o||o.d>d)out.set(k,{n,d})};
const r=resolvePhrase(t);if(r){const rn=ITEMS[r.i].n;add(rn,r.d||0);const rl=rn.toLowerCase();keys.forEach(k=>{const kl=k.toLowerCase();if(kl!==rl&&(' '+kl+' ').includes(' '+rl+' '))add(k,.3)})}
keys.forEach(k=>{const kl=k.toLowerCase();if(kl.includes(s)||(s.length>2&&s.includes(kl)))add(k,.2);else if(s.length>=3){const d=wl(s,kl);if(d<=Math.max(.7,.3*s.length))add(k,.5+d)}});
if(s.length>=2)ITEMS.forEach(it=>{if(keys.has(it.n)&&it.a.some(a=>a.startsWith(s)||wl(s,a)<=Math.max(.6,.3*s.length)))add(it.n,.4)});
return[...out.values()].sort((a,b)=>a.d-b.d).slice(0,6)}
function itemRes(){const pool=S.tx.filter(x=>x.t==='ex'&&(S.ir==='a'||x.d.startsWith(S.m)));let name=S.iq,via='';const cs=S.iqs.trim()?suggest(S.iqs,pool):[];
if(!name&&cs.length){name=cs[0].n;if(S.iqs.trim().toLowerCase()!==name.toLowerCase())via=S.iqs.trim()}
if(!name){const P=grp(pool,itemOf),C0={};pool.forEach(x=>{const k=itemOf(x);C0[k]=C0[k]||x.cat});
if(S.iqs.trim())return'<p class="mu">No item found for that. Try another spelling.</p>';
return P.length?`<div class="card"><b>Items by spending</b>${P.slice(0,40).map(p=>`<div class="li" data-a="it" data-v="${esc(p.k)}" style="cursor:pointer"><span class="ic">${(CAT[C0[p.k]]||CAT.oth).ic}</span><div class="gr">${esc(p.k)}</div><b>${rs(p.v)}</b></div>`).join('')}</div>`:'<p class="mu">No expenses in this range</p>'}
const E=pool.filter(x=>itemOf(x)===name).sort((a,b)=>b.d.localeCompare(a.d)||b.ts-a.ts);let g=0,ml=0,tot=0;E.forEach(x=>{tot+=x.amt;const q=qv(x.note);if(q){if(q.k==='g')g+=q.v;else ml+=q.v}});
const qt=g&&!ml?fmt(g,'g'):ml&&!g?fmt(ml,'ml'):'',per=qt?Math.round(tot/100/((g||ml)/1000)):0,un=g?'KG':'L',chips=cs.filter(c=>c.n!==name).slice(0,4).map(c=>`<span class="chip" data-a="iq" data-v="${esc(c.n)}">${esc(c.n)}</span>`).join('');

(async()=>{try{DL=await claude.use('downloads')}catch(e){}return;try{const u=await claude.use('user'),db=await claude.use('db');if(u&&db){const id=await u.id();coll=db.collection('data/users/'+id);let first=1;coll.onSnapshot(s=>{const docs=s.docs.map(d=>d.data());if(first){first=0;const ids=new Set(docs.map(d=>d.id));S.tx.filter(x=>!ids.has(x.id)).forEach(x=>{docs.push(x);coll.doc(x.id).set(x).catch(()=>{})})}S.tx=docs;cache();if(S.tab!=='add')render()},()=>{})}}catch(e){}

try{DL=await claude.use('downloads')}catch(e){}
if(S.tab!=='add')render()})();
