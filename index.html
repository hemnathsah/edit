<!doctype html><html lang="en"><head><meta charset="utf-8"><title>KharchaMitra</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f4f6f2;--cd:#fff;--tx:#1b2a21;--mu:#69786e;--ac:#1f7a4d;--ex:#cf4f36;--bd:#e1e7df;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#111a14;--cd:#1a251e;--tx:#e8efe9;--mu:#94a59a;--ac:#4cc489;--ex:#ef7d63;--bd:#2a382f;color-scheme:dark}}
:root[data-theme=dark]{--bg:#111a14;--cd:#1a251e;--tx:#e8efe9;--mu:#94a59a;--ac:#4cc489;--ex:#ef7d63;--bd:#2a382f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans Devanagari',sans-serif}
#app{max-width:760px;margin:0 auto;padding:14px 14px 96px}
.top,.row,.li,.mo{display:flex;align-items:center;gap:8px}.sp{flex:1}.gr{flex:1;min-width:0}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.g3 .card{margin:0;text-align:center}.g3 b{font-size:16px}
small,.mu{color:var(--mu)}h4{margin:14px 0 4px;color:var(--mu);font-size:13px}
input,select,textarea,button{font:inherit;color:var(--tx)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);margin:4px 0}
button,.btn{border:1px solid var(--bd);background:var(--cd);border-radius:10px;padding:9px 12px;cursor:pointer;font:inherit;color:var(--tx)}
.p{background:var(--ac);color:#fff;border-color:var(--ac)}button.on{border-color:var(--ac);background:var(--ac);color:#fff}
.x{border:0;background:none;color:var(--mu);font-size:20px;padding:2px 8px}.ex{color:var(--ex)}.in{color:var(--ac)}
.ic{font-size:22px}.bar{height:8px;border-radius:6px;background:var(--ac);opacity:.85;margin-top:3px}
.seg{display:flex;gap:6px}.seg button{flex:1}.li{padding:8px 0;border-bottom:1px solid var(--bd)}
.ri{display:grid;grid-template-columns:1fr 78px 1fr auto;gap:4px;align-items:center}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:8px;font-size:18px}nav small{display:block;font-size:11px}nav .on{color:var(--ac);background:none}
#ts{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none}
#mic.on{background:var(--ex);color:#fff;border-color:var(--ex)}
</style></head><body><div id="app"></div>
<nav><button data-a="tab" data-v="home">🏠<small>Home</small></button><button data-a="tab" data-v="add">➕<small>Add</small></button><button data-a="tab" data-v="hist">🧾<small>History</small></button></nav>
<div id="ts"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const C=[
['groc','Groceries','किराना','🛒','ex','saffola fortune sooji suji rawa chana chole matar rajma moong masoor urad toor arhar mustard sarson refined bread flour wheat noodles pasta oats chips chocolate juice soda cola cookies pulses lentil atta aata chawal rice dal daal chini cheeni sugar namak salt tel oil ghee masala mirch haldi besan maida suji poha biscuit maggi chai tea sabun आटा चावल दाल चीनी नमक तेल मसाला'],
['veg','Veg & Fruits','सब्ज़ी-फल','🥬','ex','vegetable vegetables carrot cabbage spinach chilli garlic ginger mango orange grapes sabzi sabji sabzee pyaaz pyaj onion aloo potato tamatar tomato gobhi bhindi palak adrak nimbu fruit seb apple kela banana aam angoor सब्जी प्याज आलू टमाटर फल'],
['dairy','Dairy','दूध-डेयरी','🥛','ex','doodh dudh milk dahi curd paneer anda egg ande makhan butter lassi amul दूध दही पनीर'],
['eat','Eating Out','बाहर खाना','🍽️','ex','restaurant hotel dhaba pizza burger zomato swiggy samosa chaat momo cafe thali biryani'],
['trn','Transport','यात्रा','🚌','ex','petrol diesel fuel auto cab ola uber bus train ticket metro parking toll fastag पेट्रोल डीज़ल'],
['util','Utilities','बिल-रिचार्ज','💡','ex','bijli electricity bill recharge wifi internet gas cylinder pani water dth jio airtel बिजली रिचार्ज'],
['house','Housing','घर','🏠','ex','rent kiraya maintenance repair plumber mistri किराया'],
['hlth','Health','स्वास्थ्य','💊','ex','dawai dawa medicine medical doctor dr test hospital chemist दवा दवाई'],
['edu','Education','शिक्षा','📚','ex','fees fee school tuition book kitab copy pen stationery'],
['shop','Shopping','खरीदारी','🛍️','ex','scrub steel detergent surf broom phenyl mop dishwash vim harpic kapde kapda cloth shirt jeans shoes joota mobile amazon flipkart कपड़े'],
['care','Personal Care','सौंदर्य','🧴','ex','toothpaste toothbrush lotion deodorant facewash tissue salon shampoo soap cream haircut parlour'],
['fun','Entertainment','मनोरंजन','🎬','ex','movie film netflix game trip'],
['gift','Gifts & Festival','त्योहार','🎁','ex','gift tohfa festival diwali puja mandir daan donation'],
['fin','Finance','EMI/बीमा','🏦','ex','emi loan insurance bima sip lic'],
['oth','Other','अन्य','📦','ex',''],
['sal','Salary','वेतन','💼','in','salary vetan tankhwah pagar वेतन तनख्वाह'],
['biz','Business','व्यापार','🏪','in','bikri dukaan business sale कमाई'],
['oi','Other income','अन्य आय','➕','in','']];
const CAT=Object.fromEntries(C.map(([id,en,hi,ic,ty,k])=>[id,{id,en,hi,ic,ty,k:k.split(' ').filter(Boolean)}]));
const cc=x=>CAT[x.cat]||CAT.oth;
const S={tx:[],m:'',tab:'home',ty:'ex',q:'',hi:false,pick:0};
let R=null,busyMsg='',SM=null,D=null,DL=null,coll=null,listening=false;
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const rs=p=>'₹'+(p/100).toLocaleString('en-IN',{maximumFractionDigits:2});
const lab=c=>S.hi?c.hi:c.en;S.m=today().slice(0,7);
const lev=(a,b)=>{let p=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let c=[i];for(let j=1;j<=b.length;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[b.length]};
const dn=s=>s.replace(/[०-९]/g,d=>'०१२३४५६७८९'.indexOf(d));
function guess(t,ty){const w=String(t).toLowerCase().split(/[^\p{L}\p{M}]+/u).filter(x=>x.length>1);let b=ty==='in'?'oi':'oth',bs=9;for(const c of Object.values(CAT)){if(c.ty!==ty)continue;for(const k of c.k)for(const x of w){const l=k.length>5?2:k.length>3?1:0,d=k===x?0:lev(k,x);if(d<=l&&d<bs){bs=d;b=c.id}}}return b}
function localParse(t){const items=[];for(const g of dn(t).split(/[,\n;]+|\s+(?:aur|and|और)\s+/i)){const m=g.match(/\d+(?:\.\d+)?/g);if(!m)continue;const ty=/salary|vetan|aayi|aaya|mila|income|वेतन|कमाई/i.test(g)?'in':'ex';const name=g.replace(/\d+(?:\.\d+)?/g,' ').replace(/\b(rs|rupees?|rupaye|rupay|ka|ki|ke|ko|diye|dala|liya)\b|₹/gi,' ').replace(/\s+/g,' ').trim();items.push({name:name||'Entry',amount:+m[m.length-1],cat:guess(g,ty),type:ty})}return{merchant:'',date:'',items}}
const toast=m=>{const t=$('#ts');t.textContent=m;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,2600)};
const cache=()=>{try{localStorage.setItem('km_tx',JSON.stringify(S.tx))}catch(e){}};
try{S.tx=JSON.parse(localStorage.getItem('km_tx')||'[]');S.hi=localStorage.getItem('km_hi')==='1'}catch(e){}
function put(t){if(t.bill&&S.img&&t.bill===S.bid){t.img=1;idbPut(t.bill,S.img)}S.tx=S.tx.filter(x=>x.id!==t.id).concat(t);cache()}
function rm(id){S.tx=S.tx.filter(x=>x.id!==id);cache();if(coll)coll.doc(id).delete().catch(()=>{})}
const mk=o=>({id:uid(),t:o.type,amt:Math.round(o.amount*100),cat:o.cat,note:o.note||'',mer:o.mer||'',d:o.date||today(),pay:o.pay||'',bill:o.bill||(S.img?(S.bid=S.bid||uid()):''),src:o.src||'manual',ts:Date.now()});
const mtx=()=>S.tx.filter(x=>x.d.startsWith(S.m)).sort((a,b)=>b.d.localeCompare(a.d)||b.ts-a.ts);
const sum=(L,t)=>L.filter(x=>x.t===t).reduce((s,x)=>s+x.amt,0);
const row=x=>{const c=cc(x);return `<div class="li"><span class="ic">${c.ic}</span><div class="gr"><div>${esc(x.note||lab(c))}</div><small>${esc(x.mer?x.mer+' · ':'')}${lab(c)}${x.pay?' · '+esc(x.pay):''}</small></div>${x.img?`<button class='x' data-a='vi' data-v='${x.bill}'>🧾</button>`:''}<b class="${x.t}">${x.t==='in'?'+':'−'}${rs(x.amt)}</b><button class="x" data-a="ed" data-v="${x.id}">✏️</button></div>`};
const opts=(sel,ty)=>Object.values(CAT).filter(c=>c.ty===ty).map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${c.ic} ${esc(lab(c))}</option>`).join('');
const head=()=>{const[y,m]=S.m.split('-').map(Number);return `<div class="top"><b style="font-size:18px">🪙 KharchaMitra</b><span class="sp"></span><button data-a="lang">${S.hi?'EN':'हिं'}</button><small>📱 Saved on this device</small></div>`+(S.tab==='add'?'':`<div class="mo" style="justify-content:center;margin:8px 0"><button data-a="mo" data-v="-1">‹</button><b>${new Date(y,m-1).toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</b><button data-a="mo" data-v="1">›</button></div>`)};
function home(){const L=mtx(),inc=sum(L,'in'),ex=sum(L,'ex'),by={};L.filter(x=>x.t==='ex').forEach(x=>by[x.cat]=(by[x.cat]||0)+x.amt);const r=Object.entries(by).sort((a,b)=>b[1]-a[1]),mx=r.length?r[0][1]:1;
return `<div class="g3"><div class="card"><small>Income</small><br><b class="in">${rs(inc)}</b></div><div class="card"><small>Expense</small><br><b class="ex">${rs(ex)}</b></div><div class="card"><small>Balance</small><br><b>${rs(inc-ex)}</b></div></div>
<div class="card"><b>Where money went</b>${r.length?r.map(([id,v])=>{const c=CAT[id]||CAT.oth;return `<div style="margin-top:8px"><div class="row"><span>${c.ic} ${esc(lab(c))}</span><span class="sp"></span><b>${rs(v)}</b></div><div class="bar" style="width:${Math.max(4,v/mx*100)}%"></div></div>`}).join(''):'<p class="mu">No expenses yet. Tap Add to start ✨</p>'}</div>
<div class="card"><b>Recent</b>${L.slice(0,6).map(row).join('')||'<p class="mu">Nothing here</p>'}</div>`}
function hl(){let L=mtx();const q=S.q.toLowerCase().trim();if(q){const g=guess(q,'ex');L=L.filter(x=>(x.note+' '+x.mer+' '+cc(x).en+' '+cc(x).hi).toLowerCase().includes(q)||(g!=='oth'&&x.cat===g))}if(!L.length)return '<p class="mu">No entries</p>';let h='',d='';for(const x of L){if(x.d!==d){d=x.d;h+=`<h4>${new Date(d+'T00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'})}</h4>`}h+=row(x)}return h}
const hist=()=>`<div class="row"><input id="q" placeholder="Search: doodh, दूध, petrol…" value="${esc(S.q)}"><button data-a='ex'>⬇ CSV</button><button data-a='bk'>💾</button><label class='btn'>📂<input type='file' accept='.json' id='rs' hidden></label></div><div id="hl">${hl()}</div>`;
const add=()=>`<div class="card"><div class="seg"><button data-a="ty" data-v="ex" class="${S.ty==='ex'?'on':''}">Expense</button><button data-a="ty" data-v="in" class="${S.ty==='in'?'on':''}">Income</button></div>
<input id="am" type="number" inputmode="decimal" placeholder="₹ Amount"><input id="nt" placeholder="Item or shop (doodh, petrol, salary…)"><select id="ct">${opts(S.ty==='in'?'oi':'oth',S.ty)}</select>
<div class="row"><input id="dt" type="date" value="${today()}"><select id="py"><option>Cash</option><option>UPI</option><option>Card</option><option>Bank</option></select></div><button class="btn p" data-a="sv" style="width:100%">Save</button></div>
<div class="card"><b>✨ Smart entry</b><br><small>Type, speak or scan, in English, हिन्दी or Hinglish. Spelling mistakes are fine.</small>
<textarea id="sm" rows="3" placeholder="doodh 2 ltr 120, chini 1 kilo 48, aata 5kg 210"></textarea>
<div class="row" style="flex-wrap:wrap"><button id='mic' data-a='mic'>🎤 Speak</button><select id='vl' style='width:auto'><option value='hi-IN'>हिन्दी / Hinglish</option><option value='en-IN'>English</option></select><button data-a='rd'>Read ✨</button><label class='btn'>📷 Camera<input type='file' accept='image/*' capture='environment' hidden></label><label class='btn'>🖼 Gallery<input type='file' accept='image/*' hidden></label></div></div><div id='ph'></div><div id='rv'></div>`;
function rv(){const e=$('#rv');if(!e)return;if(busyMsg){e.innerHTML=`<div class="card">⏳ ${busyMsg}</div>`;return}if(!R){e.innerHTML='';return}
e.innerHTML=`<div class="card"><b>Review</b>${R.merchant?' · '+esc(R.merchant):''}<br><small>Check and fix anything before saving</small>`+R.items.map((i,n)=>`<div class="ri"><input data-i="${n}" data-k="name" value="${esc(i.name)}"><input data-i="${n}" data-k="amount" type="number" inputmode="decimal" value="${i.amount}"><select data-i="${n}" data-k="cat">${opts(i.cat,i.type)}</select><button class="x" data-a="rx" data-v="${n}">×</button></div>`).join('')+`<div class="row" style="margin-top:8px"><b>${rs(Math.round(R.items.reduce((s,i)=>s+(i.type==='in'?0:+i.amount||0),0)*100))}</b>${R.total?(Math.abs(R.items.reduce((s,i)=>s+(+i.amount||0),0)-R.total)<1?' <small class="in">✓ matches bill total '+R.total+'</small>':' <small class="ex">⚠ bill total is '+R.total+'</small>'):''}<span class="sp"></span><button data-a="rc">Cancel</button><button class="btn p" data-a="rs">Save all</button></div></div>`}
async function readAI(text,file){if(!text&&!file)return toast('Type, speak or scan first');busyMsg='Reading…';rv();R=null;
try{if(!SM)throw 0;if(file&&!(await SM.limits()).images)throw 0;
const P=`You read Indian shopping bills and notes written in English, Hindi (Devanagari) or Hinglish (Hindi in Roman letters), printed or handwritten, possibly with spelling mistakes. Return ONLY JSON: {"merchant":"","date":"YYYY-MM-DD or empty","items":[{"name":"English item name with spelling fixed","amount":rupees as number,"cat":"category id","type":"ex or in"}]}. One entry per line item (amount = line total, not the rate). If only a total is readable, give one item. Category ids: ${Object.values(CAT).map(c=>c.id+'='+c.en).join(', ')}. Today is ${today()}.`+(text?`\nText:\n${text}`:'');
R=await SM.json(P,file?{images:[file]}:{})}catch(e){R=file?null:localParse(text);if(file)toast('Bill reading needs Claude access. Type the items instead.')}
busyMsg='';if(R){R.src=file?'scan':'text';R.items=(R.items||[]).map(i=>{const ty=i.type==='in'?'in':'ex';return{name:String(i.name||''),amount:+i.amount||0,cat:CAT[i.cat]&&CAT[i.cat].ty===ty?i.cat:guess(i.name,ty),type:ty}});if(!R.items.length){R=null;toast('Nothing found')}}rv()}
function save(){const a=+$('#am').value,d=$('#dt').value||today();if(!(a>0))return toast('Enter an amount');put(mk({type:S.ty,amount:a,cat:$('#ct').value,note:$('#nt').value.trim(),date:d,pay:$('#py').value}));S.tab='home';S.m=d.slice(0,7);render();S.img=null;S.bid=null;toast('Saved ✓')}
function saveR(){const b=S.img?(S.bid=S.bid||uid()):uid(),d=/^\d{4}-\d{2}-\d{2}$/.test(R.date)?R.date:today(),L=R.items.filter(i=>i.amount>0);if(!L.length)return toast('Nothing to save');L.forEach(i=>put(mk({type:i.type,amount:i.amount,cat:i.cat,note:i.name,mer:R.merchant,date:d,bill:b,pay:R.pay||'',src:R.src})));R=null;S.tab='home';S.m=d.slice(0,7);render();S.img=null;S.bid=null;toast('Saved '+L.length+' ✓')}
async function exportCsv(){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv='Date,Type,Amount,Category,Item,Shop,Payment\n'+mtx().map(x=>[x.d,x.t==='in'?'Income':'Expense',x.amt/100,cc(x).en,x.note,x.mer,x.pay].map(q).join(',')).join('\n');try{await DL.save({filename:'kharcha-'+S.m+'.csv',data:csv})}catch(e){toast('Export not available here')}}
const NW={ek:1,do:2,teen:3,char:4,chaar:4,paanch:5,panch:5,chhe:6,saat:7,aath:8,nau:9,das:10,gyarah:11,barah:12,terah:13,chaudah:14,pandrah:15,solah:16,satrah:17,atharah:18,bees:20,tees:30,chalis:40,pachas:50,saath:60,sattar:70,assi:80,nabbe:90,sau:100,hazaar:1000,hajar:1000,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90,hundred:100,thousand:1000};
function nw(s){const o=[];let cur=0,tot=0,on=0;const fl=()=>{if(on){o.push(tot+cur);cur=tot=on=0}};
for(const x of s.split(/\s+/)){const v=/\d/.test(x)?undefined:NW[x.toLowerCase().replace(/[^a-z]/g,'')];if(v===undefined){fl();o.push(x);continue}
if(on&&v<100&&cur>0&&!(cur%100===0||(cur%100>=20&&cur%10===0&&v<10)))fl();
on=1;if(v===100)cur=(cur||1)*100;else if(v===1000){tot+=(cur||1)*1000;cur=0}else cur+=v}fl();return o.join(' ')}
const CUR=/^(rs\.?|rupees?|rupaye|rupay|rupya|rupiya|inr|रुपये|रुपए|रु)$/i,MEAS=/^(kg|kgs|kilo|kilos|gm|gms|gram|grams|g|ltr|ltrs|litre|litres|liter|liters|l|ml|pkt|pkts|packet|packets|pack|packs|piece|pieces|pcs|pc|nos|dozen|किलो|ग्राम|लीटर|पैकेट)$/i,FIL=/^(ka|ki|ke|ko|se|ne|diye|diya|dala|dalwaya|liya|kharcha|kharch|aaj|kal|parso|upi|paid|for|of|the|a|an|is|was|at|on|in|each|total|amount|price|का|की|के|को|से|ने|दिए|दिया|लिया|आज|कल)$/i;
function parse(t){const items=[],yd=/\bkal\b|yesterday|कल/i.test(t)?new Date(Date.now()-864e5-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10):'';
t=nw(dn(t.replace(/₹/g,' ').replace(/\brs\./gi,'rs').replace(/(\d),(?=\d{3}\b)/g,'$1').replace(/[,;\n।]+|\.\s+/g,' | ')));let c=null;
const fl=()=>{if(c&&c.n>0){const nm=c.p.join(' ').replace(/\s+/g,' ').trim(),ty=/salary|vetan|tankhwah|income|credited|aayi|aaya|mila|वेतन|कमाई|मिला/i.test(nm)?'in':'ex';items.push({name:nm||'Entry',amount:c.n,cat:guess(nm,ty),type:ty})}c=null};
for(const w of t.split(/\s+/)){if(!w)continue;if(w==='|'||/^(and|aur|plus|then|next|और)$/i.test(w)){if(c&&c.n!==null)fl();continue}
if(/^\d+(\.\d+)?$/.test(w)){if(!c)c={p:[],n:null,af:1};if(c.n!==null)c.p.push(String(c.n));c.n=+w;continue}
if(/^(total|grand|subtotal)$/i.test(w))break;if(CUR.test(w)||FIL.test(w))continue;
if(MEAS.test(w)){if(c){if(c.n!==null){c.p.push(c.n+' '+w);c.n=null}else c.p.push(w)}continue}
if(c&&c.n!==null&&c.p.length&&!c.af)fl();if(!c)c={p:[],n:null};c.p.push(w)}
fl();return{merchant:'',date:yd,items}}
const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
const SKIP=/^[\W_]*(sub ?total|grand|total|tota|gst|cgst|sgst|igst|output|tax|cash|change|round|discount|amount|balance|tender|card|upi|paid|pay|mrp|invoice|bill|date|time|phone|ph|tel|gstin|fssai|memo|user|place|thank|visit|qty|item|description|savings|your|rupees|non)\b/i;
function nt(t,first){const m=t.match(/^[^\w§|]*([\dOoIl|S§B][\dOoIl|S§B.,]*)[A-Za-z¢]{0,2}$/);if(!m||!/[0-9]/.test(m[1]))return NaN;
let s=m[1].replace(/[Oo]/g,'0').replace(/[Il|]/g,'1').replace(/[S§]/g,'5').replace(/B/g,'8');
if(/^\d+,\d{2}$/.test(s)||(first&&/^\d+,\d{3}$/.test(s)))s=s.replace(',','.');else s=s.replace(/,/g,'');
return/^\d+(\.\d+)?$/.test(s)?parseFloat(s):NaN}
function cleanName(p){let n=p.replace(/\s+/g,' ').trim();const h=n.search(/\s[0-9OIlS]{7,9}(?![0-9A-Za-z])/);if(h>0)n=n.slice(0,h);
n=n.replace(/^(?:[\d§|:.,;!OoIl]{1,3}\s+)+/,'').replace(/(\s+[^\sA-Za-z0-9]{1,3}|\s+[a-z]{1,2})+$/,'').replace(/\b(500|250|100|200|750|50)[G6&85S]{1,2}\b/g,'$1G').replace(/\b(\d)K[G6&8](?![A-Za-z0-9])/g,'$1KG').replace(/\bOi[\]l|]/g,'Oil').replace(/\b[iIl][Lh]\b|\b1h\b/g,'1L');return n.trim()}
function mkItem(p,n){const x=n.slice(-4),a=x[x.length-1],r=x[x.length-2]||a;let amt=a;
if(x.length===4){let q=x[0];const m=x[1];if(q>0&&q<=200&&Math.abs(q-Math.round(q))<.06){q=Math.round(q);if(Math.abs(q*r-a)>.5){const k=a/r,u=a/q;if(!(k>=.9&&Math.abs(k-Math.round(k))<.02)&&!(Math.abs(u*2-Math.round(u*2))<.02&&u<=m+.5))amt=q*r}}}
const name=cleanName(p);return{name:name||'Item',amount:Math.round(amt*100)/100,cat:guess(name,'ex'),type:'ex'}}
function billParse(tx){const L=tx.replace(/[|_]/g,' ').split(/\n+/).map(s=>s.trim()).filter(Boolean),items=[];let pend='',total=0;
for(let l of L){if(/^[\W_]*(sub ?total|grand ?total|total|tota)\b/i.test(l)&&items.length){const m=l.match(/(\d[\d,]*[.,]\d{2})\D*$/);total=m?parseFloat(m[1].replace(/,(?=\d{3})/g,'').replace(',','.')):0;break}
if((l.match(/\b\d+[.,]\d{2,3}\b/g)||[]).length>=2)l=l.replace(/(\d)\s(\d{2})(?=\s|$)/g,'$1.$2');
const T=l.split(/\s+/),ns=[];let wd=0;for(const t of T){const v=nt(t,ns.length===0);if(!isNaN(v)&&/[.,]\d{2,3}[A-Za-z¢]{0,2}$/.test(t))ns.push(v);else if(/[A-Za-z]{2,}/.test(t)&&isNaN(v))wd++}
if(ns.length>=3&&wd<=1){if(pend)items.push(mkItem(pend,ns));pend='';continue}
if(SKIP.test(l)){pend='';continue}
const pr=T.filter(t=>/^\d+[.,]\d{2}$/.test(t));
if(pr.length&&wd>=1){const j=T.findIndex((t,i)=>i>0&&!isNaN(nt(t,0))&&/^[\d.,]+$/.test(t)),nm=cleanName((j<0?T:T.slice(0,j)).join(' ')),am=parseFloat(pr[pr.length-1].replace(',','.'));
if(/[A-Za-z]{2}/.test(nm)&&am>0)items.push({name:nm,amount:am,cat:guess(nm,'ex'),type:'ex'});pend='';continue}
if(wd>=1&&!pr.length)pend=l}
const fl1=L.slice(0,8).find(s=>/\b[A-Za-z]{5,}\b/.test(s))||'',best=fl1.match(/[A-Za-z]{3,}/g)||[];
const t2=tx.match(/(\d{1,2})[\s\-\/.]([A-Za-z]{3})[a-z]*[\s\-\/.,]*(\d{4}|\d{2})\b/),t3=tx.match(/\b(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4}|\d{2})\b/);let date='';
const mk=(d,m,y)=>(m>=1&&m<=12&&d>=1&&d<=31)?(String(y).length===2?'20'+y:y)+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0'):'';
if(t2&&MON[t2[2].toLowerCase()])date=mk(+t2[1],MON[t2[2].toLowerCase()],t2[3]);else if(t3)date=mk(+t3[1],+t3[2],t3[3]);
const pm=(tx.match(/pay\s*mode\W*([A-Za-z ]+)/i)||tx.match(/\b(upi|gpay|google ?pay|phonepe|paytm|card|cash)\b/i)||[])[1]||'',pay=/upi|gpay|google|phonepe|paytm/i.test(pm)?'UPI':/card/i.test(pm)?'Card':/cash/i.test(pm)?'Cash':'';
return{merchant:best.join(' '),date,pay,total,items}}
function read(t){t=(t||'').trim();if(!t)return toast('Type, speak or paste items first');let r=null;if(t.split('\n').length>3&&/\d+[.,]\d{2}/.test(t)){r=billParse(t);if(!r.items.length)r=null}
R=r||parse(t);R.src=S.img?'scan':'text';if(!R.items.length){R=null;toast('No amounts found. Example: doodh 2 ltr 120')}rv()}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;function mic(){if(rec){rec.stop();return}if(!SR)return toast('Voice is not supported in this browser. Use your keyboard 🎤 key instead.');const t=$('#sm'),b=$('#mic'),base=t.value?t.value+' ':'';let fin='';rec=new SR();rec.lang=$('#vl').value;rec.interimResults=true;rec.onstart=()=>{b.classList.add('on');b.textContent='⏹ Listening…'};rec.onresult=e=>{let s='';for(const r of e.results)s+=r[0].transcript+' ';fin=s.trim();t.value=base+fin};rec.onerror=e=>toast(({'not-allowed':'Mic is blocked. Allow the microphone for this page, or use your keyboard 🎤 key.','service-not-allowed':'Mic is blocked. Use your keyboard 🎤 key.','no-speech':'Did not hear anything. Try again.','network':'Voice needs internet. Type instead or try again.'})[e.error]||'Voice error: '+e.error);rec.onend=()=>{rec=null;b.classList.remove('on');b.textContent='🎤 Speak';if(fin)read(t.value)};try{rec.start()}catch(e){rec=null}}function photo(f){const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,1100/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.img=c.toDataURL('image/jpeg',.6);S.bid=null;URL.revokeObjectURL(u);ph()};im.onerror=()=>toast('Could not open that photo');im.src=u}function ph(){const e=$('#ph');if(e)e.innerHTML=S.img?`<div class='card row'><img src='${S.img}' style='width:84px;border-radius:8px'><div class='gr'><b>Bill photo attached</b><br><small>Type or speak its items above (or paste text copied with Google Lens), then tap Read ✨. The photo is saved with the bill.</small></div><button class='x' data-a='px'>×</button></div>`:''}const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('km',1);r.onupgradeneeded=()=>r.result.createObjectStore('i');r.onsuccess=()=>ok(r.result);r.onerror=no});const idbPut=(k,v)=>idb().then(d=>d.transaction('i','readwrite').objectStore('i').put(v,k)).catch(()=>toast('Could not store photo'));const idbGet=k=>idb().then(d=>new Promise(ok=>{const q=d.transaction('i').objectStore('i').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>ok(null)})).catch(()=>null);function viewBill(id){idbGet(id).then(u=>{if(!u)return toast('Photo not found');const o=document.createElement('div');o.id='ov';o.dataset.a='cl';o.style.cssText='position:fixed;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;z-index:9;padding:12px';o.innerHTML=`<img src='${u}' style='max-width:100%;max-height:100%;border-radius:8px'>`;document.body.appendChild(o)})}function edit(id){const x=S.tx.find(t=>t.id===id);if(!x)return;const o=document.createElement('div');o.id='ov';o.dataset.a='cl';o.dataset.t=x.t;o.style.cssText='position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end;justify-content:center;z-index:9';o.innerHTML=`<div class='card' data-a='no' style='width:100%;max-width:560px;margin:0;border-radius:16px 16px 0 0;max-height:92%;overflow:auto;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))'><b>Edit entry</b>${x.bill?`<br><small>Shop and date change for every item on this bill</small>`:''}<div class='seg' style='margin-top:6px'><button data-a='et' data-v='ex' class='${x.t==='ex'?'on':''}'>Expense</button><button data-a='et' data-v='in' class='${x.t==='in'?'on':''}'>Income</button></div><input id='ea' type='number' inputmode='decimal' value='${x.amt/100}'><input id='en' placeholder='Item' value='${esc(x.note)}'><input id='em' placeholder='Shop' value='${esc(x.mer)}'><select id='ec'>${opts(x.cat,x.t)}</select><div class='row'><input id='ed' type='date' value='${x.d}'><select id='ep'>${['','Cash','UPI','Card','Bank'].map(p=>`<option ${p===x.pay?'selected':''}>${p}</option>`).join('')}</select></div><div class='row' style='margin-top:6px'><button data-a='edl' data-v='${x.id}'>🗑 Delete</button><span class='sp'></span><button data-a='cl'>Cancel</button><button class='btn p' data-a='es' data-v='${x.id}'>Save</button></div></div>`;document.body.appendChild(o)}function editSave(id){const x=S.tx.find(t=>t.id===id),o=$('#ov'),a=+$('#ea').value;if(!x)return;if(!(a>0))return toast('Enter an amount');const m=$('#em').value.trim(),d=$('#ed').value||x.d;if(x.bill)S.tx.filter(t=>t.bill===x.bill&&t.id!==id).forEach(t=>put({...t,mer:m,d}));put({...x,t:o.dataset.t,amt:Math.round(a*100),note:$('#en').value.trim(),mer:m,cat:$('#ec').value,d,pay:$('#ep').value});o.remove();S.m=d.slice(0,7);render();toast('Updated ✓')}function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.tab));$('#app').innerHTML=head()+({home,add,hist}[S.tab])();if(S.tab==='add'){rv();ph()}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
if(a==='tab'){S.tab=v;render()}
else if(a==='mo'){const[y,m]=S.m.split('-').map(Number),d=new Date(y,m-1+ +v,1);S.m=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');render()}
else if(a==='lang'){S.hi=!S.hi;try{localStorage.setItem('km_hi',S.hi?'1':'0')}catch(e){}render()}
else if(a==='ty'){S.ty=v;S.pick=0;render()}
else if(a==='rm'){if(confirm('Delete this entry?')){rm(v);render()}}else if(a==='ed')edit(v);else if(a==='et'){const o=$('#ov');o.dataset.t=v;o.querySelectorAll('[data-a=et]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));$('#ec').innerHTML=opts(guess($('#en').value,v),v)}else if(a==='es')editSave(v);else if(a==='edl'){if(confirm('Delete this entry?')){rm(v);$('#ov').remove();render()}}else if(a==='no'){}
else if(a==='sv')save();
else if(a==='rd')read($('#sm').value.trim());
else if(a==='mic')mic();else if(a==='bk'){DL?DL.save({filename:'kharchamitra-backup.json',data:JSON.stringify(S.tx)}).catch(()=>{}):toast('Backup not available here')}else if(a==='px'){S.img=null;S.bid=null;ph()}else if(a==='vi')viewBill(v);else if(a==='cl')$('#ov').remove()
else if(a==='rx'){R.items.splice(+v,1);R.items.length?rv():(R=null,rv())}
else if(a==='rs')saveR();else if(a==='rc'){R=null;rv()}else if(a==='ex')exportCsv()});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.i!==undefined)R.items[t.dataset.i][t.dataset.k]=t.dataset.k==='amount'?+t.value:t.value;else if(t.id==='nt'&&!S.pick)$('#ct').value=guess(t.value,S.ty);else if(t.id==='q'){S.q=t.value;$('#hl').innerHTML=hl()}});
document.addEventListener('change',e=>{if(e.target.id==='ct')S.pick=1;const f=e.target.files&&e.target.files[0];if(f&&e.target.id==='rs'){f.text().then(s=>{try{const a=JSON.parse(s);a.forEach(x=>x&&x.id&&put(x));render();toast('Restored '+a.length)}catch(_){toast('Not a valid backup')}});e.target.value=''}else if(f&&e.target.type==='file'){photo(f);e.target.value=''}});
render();
(async()=>{try{DL=await claude.use('downloads')}catch(e){}return;try{const u=await claude.use('user'),db=await claude.use('db');if(u&&db){const id=await u.id();coll=db.collection('data/users/'+id);let first=1;coll.onSnapshot(s=>{const docs=s.docs.map(d=>d.data());if(first){first=0;const ids=new Set(docs.map(d=>d.id));S.tx.filter(x=>!ids.has(x.id)).forEach(x=>{docs.push(x);coll.doc(x.id).set(x).catch(()=>{})})}S.tx=docs;cache();if(S.tab!=='add')render()},()=>{})}}catch(e){}
try{SM=await claude.use('sample')}catch(e){}
try{D=await claude.use('dictation');if(D){D.onFinal(({text})=>{const t=$('#sm');if(t)t.value+=(t.value?' ':'')+text});D.onState(({state})=>{listening=state==='listening';const m=$('#mic');if(m)m.classList.toggle('on',listening)})}}catch(e){}
try{DL=await claude.use('downloads')}catch(e){}
if(S.tab!=='add')render()})();
</script></body></html>
