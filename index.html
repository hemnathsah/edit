<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KharchaMitra Local</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
@property --beam-angle{
  syntax:'<angle>';
  initial-value:0deg;
  inherits:false;
}
:root{
  --bg:#f5f5f3;
  --bg-elev:#ffffff;
  --cd:rgba(255,255,255,0.84);
  --cd-solid:#ffffff;
  --cd-hover:rgba(255,255,255,0.97);
  --tx:#11131a;
  --mu:#62687a;
  --brand:#9e7632;
  --brand-rgb:158,118,50;
  --ac:#4f46e5;
  --ac-rgb:79,70,229;
  --ac-soft:rgba(79,70,229,0.10);
  --cta-bg:linear-gradient(135deg,#141722 0%,#262b3d 100%);
  --cta-tx:#ffffff;
  --cta-sh:0 10px 24px -8px rgba(17,19,26,0.42);
  --in:#059669;
  --in-rgb:5,150,105;
  --ex:#e11d48;
  --ex-rgb:225,29,72;
  --bd:rgba(17,19,26,0.09);
  --bd-hi:rgba(255,255,255,0.92);
  --sh:0 10px 30px -10px rgba(17,19,26,0.08),0 2px 6px -1px rgba(17,19,26,0.04);
  --sh-lg:0 24px 48px -12px rgba(17,19,26,0.16);
  --spot:rgba(79,70,229,0.08);
  --vault-bg:linear-gradient(145deg,#151823 0%,#0d0f17 55%,#191d2b 100%);
  --vault-tx:#f5f6fa;
  --vault-mu:#9aa1b5;
  --spring:cubic-bezier(0.22,1,0.36,1);
  --bounce:cubic-bezier(0.34,1.56,0.64,1);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --bg:#08090e;
    --bg-elev:#11131c;
    --cd:rgba(19,22,32,0.74);
    --cd-solid:#141722;
    --cd-hover:rgba(26,30,43,0.9);
    --tx:#f3f4f8;
    --mu:#8c93a6;
    --brand:#dfbe82;
    --brand-rgb:223,190,130;
    --ac:#7c86ff;
    --ac-rgb:124,134,255;
    --ac-soft:rgba(124,134,255,0.14);
    --cta-bg:linear-gradient(135deg,#f5f6fa 0%,#dce0ec 100%);
    --cta-tx:#0a0c12;
    --cta-sh:0 10px 26px -6px rgba(255,255,255,0.22);
    --in:#10b981;
    --in-rgb:16,185,129;
    --ex:#f43f5e;
    --ex-rgb:244,63,94;
    --bd:rgba(255,255,255,0.08);
    --bd-hi:rgba(255,255,255,0.10);
    --sh:0 14px 34px -10px rgba(0,0,0,0.55),0 2px 8px -2px rgba(0,0,0,0.35);
    --sh-lg:0 28px 60px -12px rgba(0,0,0,0.75);
    --spot:rgba(124,134,255,0.11);
    --vault-bg:linear-gradient(145deg,#171b29 0%,#0c0e16 58%,#1d2133 100%);
    --vault-tx:#f7f8fc;
    --vault-mu:#939bb0;
    color-scheme:dark;
  }
}
:root[data-theme=dark]{
  --bg:#08090e;
  --bg-elev:#11131c;
  --cd:rgba(19,22,32,0.74);
  --cd-solid:#141722;
  --cd-hover:rgba(26,30,43,0.9);
  --tx:#f3f4f8;
  --mu:#8c93a6;
  --brand:#dfbe82;
  --brand-rgb:223,190,130;
  --ac:#7c86ff;
  --ac-rgb:124,134,255;
  --ac-soft:rgba(124,134,255,0.14);
  --cta-bg:linear-gradient(135deg,#f5f6fa 0%,#dce0ec 100%);
  --cta-tx:#0a0c12;
  --cta-sh:0 10px 26px -6px rgba(255,255,255,0.22);
  --in:#10b981;
  --in-rgb:16,185,129;
  --ex:#f43f5e;
  --ex-rgb:244,63,94;
  --bd:rgba(255,255,255,0.08);
  --bd-hi:rgba(255,255,255,0.10);
  --sh:0 14px 34px -10px rgba(0,0,0,0.55),0 2px 8px -2px rgba(0,0,0,0.35);
  --sh-lg:0 28px 60px -12px rgba(0,0,0,0.75);
  --spot:rgba(124,134,255,0.11);
  --vault-bg:linear-gradient(145deg,#171b29 0%,#0c0e16 58%,#1d2133 100%);
  --vault-tx:#f7f8fc;
  --vault-mu:#939bb0;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  background:var(--bg);
  color:var(--tx);
  font:15px/1.5 'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans Devanagari',sans-serif;
  overflow-x:hidden;
  min-height:100dvh;
}

#bg-fx{
  position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;
}
#bg-fx::before{
  content:'';position:absolute;inset:-25%;
  background:
    radial-gradient(circle at 16% 12%, rgba(var(--ac-rgb),0.15) 0%, transparent 44%),
    radial-gradient(circle at 85% 18%, rgba(var(--brand-rgb),0.13) 0%, transparent 42%),
    radial-gradient(circle at 50% 90%, rgba(var(--ac-rgb),0.09) 0%, transparent 50%);
  animation:auroraDrift 20s ease-in-out infinite alternate;
  will-change:transform;
}
#bg-fx::after{
  content:'';position:absolute;inset:0;
  background-image:
    linear-gradient(to right, rgba(var(--ac-rgb),0.05) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(var(--ac-rgb),0.05) 1px, transparent 1px);
  background-size:36px 36px;
  mask-image:radial-gradient(ellipse 80% 55% at 50% 12%, #000 10%, transparent 78%);
  -webkit-mask-image:radial-gradient(ellipse 80% 55% at 50% 12%, #000 10%, transparent 78%);
}
@keyframes auroraDrift{
  0%{transform:translate3d(-2%,-1%,0) scale(1)}
  100%{transform:translate3d(2%,2%,0) scale(1.05)}
}

#app{max-width:740px;margin:0 auto;padding:16px 16px 112px}
.top,.row,.li,.mo{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.gr{flex:1;min-width:0}

.brand-bar{
  padding:6px 4px 10px;
  animation:blurDown .45s var(--spring) both;
}
.brand-logo{
  display:inline-flex;align-items:center;gap:10px;
  font-family:'Instrument Sans','Plus Jakarta Sans',sans-serif;
  font-weight:700;font-size:19.5px;letter-spacing:-0.025em;
}
.coin-3d-wrap{perspective:500px;width:36px;height:36px}
.coin-3d{
  width:36px;height:36px;border-radius:12px;
  display:grid;place-items:center;font-size:18px;font-weight:800;
  background:linear-gradient(135deg,#f2d79d 0%,#c79c4c 52%,#8d6723 100%);
  color:#15110a;
  box-shadow:0 8px 18px -4px rgba(var(--brand-rgb),0.55),inset 0 1px 1px rgba(255,255,255,0.75);
  transform-style:preserve-3d;
  transition:transform .6s var(--bounce);
}
.brand-logo:hover .coin-3d{transform:rotateY(180deg) scale(1.06)}
.status-pill{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11px;font-weight:600;color:var(--mu);
  background:var(--cd);border:1px solid var(--bd);
  padding:4px 10px;border-radius:999px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.status-dot{
  width:6px;height:6px;border-radius:50%;background:var(--brand);
  box-shadow:0 0 8px var(--brand);
}
.icon-btn{
  padding:7px 11px;border-radius:11px;font-weight:600;font-size:13px;
  display:inline-flex;align-items:center;justify-content:center;gap:4px;
}

.month-bar{
  justify-content:center;margin:4px 0 14px;
  animation:blurDown .5s var(--spring) .04s both;
}
.month-pill{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--cd);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--bd);
  box-shadow:var(--sh),inset 0 1px 0 var(--bd-hi);
  border-radius:999px;padding:4px 6px;
}
.month-pill button{
  width:32px;height:32px;padding:0;border-radius:50%;border:0;
  background:transparent;font-size:18px;font-weight:700;color:var(--tx);
  display:grid;place-items:center;
}
.month-pill button:hover{background:var(--ac-soft);color:var(--ac)}
.month-label{
  min-width:146px;text-align:center;font-weight:700;font-size:14px;
  letter-spacing:-0.01em;
}

/* 3D Interactive Finance Vault Card */
.vault-stage{
  perspective:1200px;
  margin:6px 0 14px;
  animation:blurReveal .55s var(--spring) both;
}
.vault-card{
  position:relative;
  background:var(--vault-bg);
  color:var(--vault-tx);
  border-radius:24px;
  padding:20px 20px 18px;
  border:1px solid rgba(255,255,255,0.14);
  box-shadow:0 24px 50px -16px rgba(8,10,18,0.55),inset 0 1px 0 rgba(255,255,255,0.22);
  transform-style:preserve-3d;
  transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
  transition:box-shadow .3s ease;
  overflow:hidden;
  will-change:transform;
}
.vault-card::before{
  content:'';position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:radial-gradient(420px circle at var(--gx,50%) var(--gy,20%), rgba(223,190,130,0.22), rgba(124,134,255,0.10) 40%, transparent 72%);
  mix-blend-mode:screen;
  transition:opacity .3s ease;
}
.vault-card::after{
  content:'';position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background-image:radial-gradient(rgba(255,255,255,0.12) 1px, transparent 1px);
  background-size:18px 18px;
  opacity:0.25;
}
.orbit-3d{
  position:absolute;right:-18px;top:-24px;width:156px;height:156px;
  pointer-events:none;transform-style:preserve-3d;
  transform:translateZ(20px);
}
.orbit-ring{
  position:absolute;inset:12px;border-radius:50%;
  border:1.5px solid rgba(223,190,130,0.34);
  box-shadow:0 0 18px rgba(223,190,130,0.14);
  animation:orbitSpin 16s linear infinite;
}
.orbit-ring.r2{
  inset:28px;border-color:rgba(124,134,255,0.38);
  animation:orbitSpinRev 11s linear infinite;
}
@keyframes orbitSpin{
  0%{transform:rotateX(68deg) rotateY(-18deg) rotateZ(0deg)}
  100%{transform:rotateX(68deg) rotateY(-18deg) rotateZ(360deg)}
}
@keyframes orbitSpinRev{
  0%{transform:rotateX(58deg) rotateY(24deg) rotateZ(360deg)}
  100%{transform:rotateX(58deg) rotateY(24deg) rotateZ(0deg)}
}
.vault-z1{position:relative;z-index:2;transform:translateZ(24px)}
.vault-z2{position:relative;z-index:3;transform:translateZ(34px)}
.vault-chip{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;
  color:#dfbe82;background:rgba(223,190,130,0.12);
  border:1px solid rgba(223,190,130,0.28);
  padding:4px 10px;border-radius:999px;
}
.vault-bal{
  font-family:'JetBrains Mono','Plus Jakarta Sans',monospace;
  font-variant-numeric:tabular-nums;
  font-size:30px;font-weight:700;letter-spacing:-0.03em;
  margin:8px 0 4px;
  background:linear-gradient(180deg,#ffffff 20%,#cbd2e6 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.vault-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;
}
.vault-sub{
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.09);
  border-radius:14px;padding:10px 12px;
  backdrop-filter:blur(8px);
}
.vault-sub small{color:var(--vault-mu);font-size:11.5px;font-weight:600;display:block}
.vault-sub b{
  font-family:'JetBrains Mono',monospace;font-size:15.5px;font-weight:700;
}
.vault-meter{
  margin-top:12px;display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--vault-mu);
}
.vault-bar{
  flex:1;height:5px;border-radius:99px;background:rgba(255,255,255,0.1);overflow:hidden;
}
.vault-bar-fill{
  height:100%;border-radius:99px;
  background:linear-gradient(90deg,#7c86ff,#dfbe82);
  transition:width .7s var(--spring);
}

.card{
  position:relative;
  background:var(--cd);
  backdrop-filter:blur(18px) saturate(160%);
  -webkit-backdrop-filter:blur(18px) saturate(160%);
  border:1px solid var(--bd);
  border-radius:20px;
  padding:16px;
  margin:12px 0;
  box-shadow:var(--sh),inset 0 1px 0 var(--bd-hi);
  transition:transform .28s var(--spring),box-shadow .28s var(--spring),border-color .28s ease;
  overflow:hidden;
}
.card::before{
  content:'';position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:radial-gradient(380px circle at var(--mx,50%) var(--my,0%), var(--spot), transparent 70%);
  opacity:0;transition:opacity .35s ease;
}
.card:hover::before{opacity:1}
.card-anim{animation:blurReveal .48s var(--spring) var(--stagger,0ms) both}

.beam-card{
  border:1px solid transparent;
  background:
    linear-gradient(var(--cd-solid),var(--cd-solid)) padding-box,
    conic-gradient(from var(--beam-angle), transparent 65%, rgba(var(--ac-rgb),0.75) 82%, rgba(var(--brand-rgb),0.85) 92%, transparent 100%) border-box;
  animation:beamSpin 6s linear infinite, blurReveal .48s var(--spring) var(--stagger,0ms) both;
}
@keyframes beamSpin{to{--beam-angle:360deg}}

.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0 12px}
.g3 .card{
  margin:0;padding:13px 10px;text-align:center;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
}
.kpi-tag{font-size:11.5px;font-weight:600;color:var(--mu)}
.kpi-val{
  font-family:'JetBrains Mono','Plus Jakarta Sans',monospace;
  font-variant-numeric:tabular-nums;
  font-size:16px;font-weight:700;letter-spacing:-0.02em;
}

small,.mu{color:var(--mu)}
h4{
  margin:18px 0 8px;color:var(--mu);font-size:12px;font-weight:700;
  text-transform:uppercase;letter-spacing:0.06em;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 4px;
}

input,select,textarea,button{font:inherit;color:var(--tx)}
input,select,textarea{
  width:100%;padding:11px 13px;
  border:1px solid var(--bd);border-radius:12px;
  background:rgba(128,136,158,0.07);
  margin:5px 0;
  transition:border-color .2s ease,box-shadow .2s ease,background .2s ease;
}
input:focus,select:focus,textarea:focus{
  outline:none;
  border-color:var(--ac);
  background:var(--cd-solid);
  box-shadow:0 0 0 3.5px var(--ac-soft);
}
.amt-wrap{position:relative;display:flex;align-items:center}
.amt-wrap::before{
  content:'₹';position:absolute;left:14px;font-weight:800;font-size:18px;color:var(--brand);pointer-events:none;
}
.amt-wrap input{
  padding-left:32px;font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:700;
}

button,.btn{
  border:1px solid var(--bd);
  background:var(--cd);
  border-radius:12px;padding:9px 14px;
  cursor:pointer;font:inherit;font-weight:600;color:var(--tx);
  transition:transform .18s var(--bounce),background .2s ease,border-color .2s ease,box-shadow .2s ease;
  user-select:none;
}
button:hover,.btn:hover{background:var(--cd-hover);border-color:rgba(var(--ac-rgb),0.35)}
button:active,.btn:active{transform:scale(0.96)}

.p{
  position:relative;overflow:hidden;
  background:var(--cta-bg);
  color:var(--cta-tx) !important;border-color:transparent;
  box-shadow:var(--cta-sh);
  font-weight:700;
}
.p::after{
  content:'';position:absolute;top:0;left:-120%;width:65%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.32),transparent);
  transform:skewX(-20deg);
  transition:left .65s ease;
}
.p:hover::after{left:150%}
button.on{border-color:var(--ac);background:var(--ac);color:#fff}

.x{
  border:0;background:transparent;color:var(--mu);font-size:18px;
  padding:5px 8px;border-radius:9px;
}
.x:hover{background:rgba(128,136,158,0.14);color:var(--tx)}
.ex{color:var(--ex);font-variant-numeric:tabular-nums}
.in{color:var(--in);font-variant-numeric:tabular-nums}
.num{font-family:'JetBrains Mono','Plus Jakarta Sans',monospace;font-variant-numeric:tabular-nums}

.seg{
  position:relative;display:flex;gap:4px;
  background:rgba(128,136,158,0.10);
  padding:4px;border-radius:13px;
  border:1px solid var(--bd);
}
.seg-pill{
  position:absolute;top:4px;bottom:4px;left:4px;
  border-radius:9.5px;
  background:var(--cta-bg);
  box-shadow:0 4px 12px -2px rgba(0,0,0,0.22);
  transition:transform .34s var(--bounce),width .34s var(--bounce);
  pointer-events:none;z-index:0;
}
.seg button{
  position:relative;z-index:1;flex:1;border:0 !important;
  background:transparent !important;box-shadow:none !important;
  padding:7px 10px;border-radius:9.5px;font-size:13.5px;font-weight:700;
  color:var(--mu);transition:color .22s ease;
}
.seg button.on{color:var(--cta-tx) !important}

.li{
  padding:10px 8px;margin:0 -8px;
  border-bottom:1px solid var(--bd);
  border-radius:12px;
  transition:background .2s ease,transform .22s var(--spring);
  animation:itemReveal .38s var(--spring) calc(var(--idx,0) * 26ms) both;
}
.li:last-child{border-bottom:0}
.li:hover,.li.hl-sync{
  background:var(--ac-soft);
  transform:translateX(3px);
}
.ic{
  width:38px;height:38px;border-radius:12px;flex:none;
  display:grid;place-items:center;font-size:19px;
  background:rgba(128,136,158,0.10);
  border:1px solid var(--bd);
}
.ri{display:grid;grid-template-columns:1fr 82px 1fr auto;gap:6px;align-items:center}
.sub-pill{
  display:inline-block;font-size:10.5px;font-weight:700;
  padding:1px 7px;border-radius:6px;
  background:var(--ac-soft);color:var(--ac);
  margin-left:5px;vertical-align:middle;
}

/* Adaptive Search Suggestions Tray */
.search-box{position:relative}
.adapt-tray{
  display:flex;flex-wrap:wrap;align-items:center;gap:6px;
  padding:8px 10px;margin:2px 0 6px;
  border-radius:14px;
  background:var(--cd);
  border:1px solid rgba(var(--ac-rgb),0.22);
  backdrop-filter:blur(14px);
  animation:blurReveal .24s var(--spring) both;
}
.adapt-chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 10px;border-radius:999px;
  font-size:12px;font-weight:600;
  background:rgba(128,136,158,0.09);
  border:1px solid var(--bd);
  cursor:pointer;transition:all .18s var(--spring);
}
.adapt-chip:hover,.adapt-chip.exact{
  background:var(--ac-soft);border-color:rgba(var(--ac-rgb),0.38);color:var(--ac);
}
.adapt-chip small{font-size:10.5px;opacity:0.8}

nav{
  position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);
  width:min(440px,calc(100vw - 24px));
  display:flex;align-items:center;
  background:var(--cd);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid var(--bd);
  border-radius:22px;padding:5px;
  box-shadow:var(--sh-lg),inset 0 1px 0 var(--bd-hi);
  z-index:8;
}
#nav-pill{
  position:absolute;top:5px;bottom:5px;left:5px;
  border-radius:16px;
  background:var(--ac-soft);
  border:1px solid rgba(var(--ac-rgb),0.28);
  transition:transform .36s var(--bounce),width .36s var(--bounce);
  pointer-events:none;z-index:0;
}
nav button{
  position:relative;z-index:1;flex:1;border:0 !important;border-radius:16px;
  background:none !important;padding:7px 4px;font-size:19px;
  color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;
  transition:color .22s ease,transform .22s var(--bounce);
}
nav button:hover{color:var(--tx)}
nav small{display:block;font-size:11px;font-weight:700;letter-spacing:0.01em;color:inherit}
nav .on{color:var(--ac) !important;transform:translateY(-1px)}

#ts{
  position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));
  transform:translate(-50%,14px) scale(0.94);
  background:rgba(15,17,26,0.94);color:#f5f6fa;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);

const qv=n=>{const m=String(n).match(SIZE);if(!m)return null;const v=parseFloat(m[1].replace(',','.')),u=m[2].toLowerCase();return(u==='ml'||u[0]==='l')?{k:'ml',v:u==='ml'?v:v*1000}:{k:'g',v:u[0]==='g'?v:v*1000}};

/* Adaptive Predictive Search Engine */
function adaptivePredict(q,pool){
  const raw=String(q||'').trim().toLowerCase();
  if(!raw)return[];
  const tokens=dev(raw).replace(/[^\p{L}\p{M}\s]/gu,' ').split(/\s+/).filter(Boolean);
  if(!tokens.length)return[];
  const s=tokens.join(' '),sp=phk(s.replace(/ /g,''));
  const loggedSet=new Set((pool||[]).map(itemOf));
  const scores=new Map();
  const push=(name,score,alias='',sub='')=>{
    const prev=scores.get(name);
    if(!prev||score<prev.score)scores.set(name,{name,score,alias,sub,logged:loggedSet.has(name)});
  };
  loggedSet.forEach(k=>{
    const kl=k.toLowerCase();
    if(kl===s)push(k,0,'',subCatOf(k));
    else if(kl.startsWith(s))push(k,0.12,'',subCatOf(k));
    else if(kl.includes(s))push(k,0.28,'',subCatOf(k));
    else if(s.length>=3){
      const d=wl(s,kl);
      if(d<=Math.max(0.8,0.34*s.length))push(k,0.45+d*0.35,'',subCatOf(k));
    }
  });
  for(const it of ITEMS){
    const nl=it.n.toLowerCase(),sl=it.s.toLowerCase();
    if(nl===s)push(it.n,0.02,'',it.s);
    else if(nl.startsWith(s))push(it.n,0.14,'',it.s);
    else if(nl.includes(s))push(it.n,0.32,'',it.s);
    else if(sl.startsWith(s)&&s.length>=3)push(it.n,0.52,it.s,it.s);
    for(const a of it.a){
      const al=dev(a.toLowerCase());
      if(al===s)push(it.n,0.05,a,it.s);
      else if(al.startsWith(s))push(it.n,0.18,a,it.s);
      else if(s.length>=3&&al.includes(s))push(it.n,0.38,a,it.s);
      else if(s.length>=3&&Math.abs(al.length-s.length)<=3){
        const d=wl(s,al);
        if(d<=Math.max(0.75,0.34*s.length))push(it.n,0.42+d*0.32,a,it.s);
      }
    }
    if(sp.length>=2&&it.pk&&it.pk.startsWith(sp))push(it.n,0.48,'',it.s);
  }
  return[...scores.values()]
    .sort((a,b)=>(a.score-(a.logged?0.12:0))-(b.score-(b.logged?0.12:0)))
    .slice(0,8);
}

function suggest(q,pool){return adaptivePredict(q,pool).map(x=>({n:x.name,d:x.score,alias:x.alias,sub:x.sub,logged:x.logged}))}
function renderAdaptiveTray(preds,actionName){

}

function extractStoreMeta(fullTx,sellerTx){

function findTotals(tx,sum){

  const last=l=>{const a=nums(l);return a.length?a[a.length-1]:0};

function billParse(tx,sellerTx){

    date,pay,tax:tt.tax,total,gross:tt.gross,saved:tt.saved,items

function otsu(g){const h=new Array(256).fill(0);for(let i=0;i<g.length;i++)h[g[i]]++;const n=g.length;let s=0;for(let i=0;i<256;i++)s+=i*h[i];let sb=0,wb=0,mx=0,th=127;for(let i=0;i<256;i++){wb+=h[i];if(!wb)continue;const wf=n-wb;if(!wf)break;sb+=i*h[i];const d=sb/wb-(s-sb)/wf,v=wb*wf*d*d;if(v>mx){mx=v;th=i}}return th}
function paperBox(g,w,h){const o=otsu(g),q=Array.from(g).sort((a,b)=>a-b)[Math.floor(g.length*.95)],t=o+.4*(q-o),m=new Uint8Array(w*h);for(let i=0;i<m.length;i++)m[i]=g[i]>t?1:0;
const e=new Uint8Array(w*h);for(let y=2;y<h-2;y++)for(let x=2;x<w-2;x++){const i=y*w+x;e[i]=m[i]&m[i-1]&m[i+1]&m[i-2]&m[i+2]&m[i-w]&m[i+w]&m[i-2*w]&m[i+2*w]}
const lab=new Int32Array(w*h),st=[];let best=null,bs=0,id=0;
for(let i=0;i<e.length;i++){if(!e[i]||lab[i])continue;id++;let a=0,x0=w,y0=h,x1=0,y1=0;st.push(i);lab[i]=id;
while(st.length){const j=st.pop(),x=j%w,y=(j-x)/w;a++;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
if(x>0&&e[j-1]&&!lab[j-1]){lab[j-1]=id;st.push(j-1)}if(x<w-1&&e[j+1]&&!lab[j+1]){lab[j+1]=id;st.push(j+1)}if(y>0&&e[j-w]&&!lab[j-w]){lab[j-w]=id;st.push(j-w)}if(y<h-1&&e[j+w]&&!lab[j+w]){lab[j+w]=id;st.push(j+w)}}
if(a>bs){bs=a;best=[x0-2,y0-2,x1+3,y1+3]}}
return best&&bs>w*h*.06?best:null}

function autoOrientCanvas(c){
  const w=c.width,h=c.height;
  if(h<=w*1.12)return c;
  const s=220/Math.max(w,h),sw=Math.max(16,Math.round(w*s)),sh=Math.max(16,Math.round(h*s));
  const sc=document.createElement('canvas');sc.width=sw;sc.height=sh;
  const sx=sc.getContext('2d',{willReadFrequently:true});sx.drawImage(c,0,0,sw,sh);
  const d=sx.getImageData(0,0,sw,sh).data;
  const rowSum=new Float32Array(sh),colSum=new Float32Array(sw);
  let leftInk=0,rightInk=0;
  for(let y=0;y<sh;y++)for(let x=0;x<sw;x++){
    const i=(y*sw+x)*4,ink=Math.max(0,215-(d[i]*299+d[i+1]*587+d[i+2]*114)/1000);
    rowSum[y]+=ink;colSum[x]+=ink;
    if(x<sw/2)leftInk+=ink;else rightInk+=ink;
  }
  const variance=arr=>{const m=arr.reduce((a,b)=>a+b,0)/arr.length;return arr.reduce((a,b)=>a+(b-m)*(b-m),0)/arr.length};
  if(variance(colSum)>variance(rowSum)*1.35){
    const deg=rightInk>=leftInk?270:90;
    const rot=document.createElement('canvas');rot.width=h;rot.height=w;
    const rx=rot.getContext('2d');
    rx.translate(rot.width/2,rot.height/2);
    rx.rotate(deg*Math.PI/180);
    rx.drawImage(c,-w/2,-h/2);
    return rot;
  }
  return c;
}

function flattenPaper(c){
  const ctx=c.getContext('2d',{willReadFrequently:true}),w=c.width,h=c.height,img=ctx.getImageData(0,0,w,h),d=img.data;
  let rSum=0,gSum=0,bSum=0,cnt=0;
  for(let i=0;i<d.length;i+=64){rSum+=d[i];gSum+=d[i+1];bSum+=d[i+2];cnt++}
  const isWarmPaper=(rSum-gSum)/Math.max(1,cnt)>16;
  const lum=new Uint8Array(w*h),inkBoost=new Uint8Array(w*h);
  for(let i=0,j=0;j<lum.length;i+=4,j++){
    const r=d[i],g=d[i+1],b=d[i+2];
    lum[j]=isWarmPaper?((r*720+g*200+b*80)/1000|0):((r*299+g*587+b*114)/1000|0);
    inkBoost[j]=Math.max(0,(b-r)*0.65+(b-g)*0.35)|0;
  }
  const step=32,gw=Math.ceil(w/step)+1,gh=Math.ceil(h/step)+1,grid=new Float32Array(gw*gh);
  for(let gy=0;gy<gh;gy++){
    const y0=Math.min(h-1,gy*step),y1=Math.min(h,y0+step);
    for(let gx=0;gx<gw;gx++){
      const x0=Math.min(w-1,gx*step),x1=Math.min(w,x0+step);
      let mx=60;
      for(let y=y0;y<y1;y+=2){const r=y*w;for(let x=x0;x<x1;x+=2){const v=lum[r+x];if(v>mx)mx=v}}
      grid[gy*gw+gx]=mx;
    }
  }
  for(let pass=0;pass<2;pass++){
    const tmp=new Float32Array(grid);
    for(let y=0;y<gh;y++)for(let x=0;x<gw;x++){
      let s=0,n=0;
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const yy=y+dy,xx=x+dx;if(yy>=0&&yy<gh&&xx>=0&&xx<gw){s+=tmp[yy*gw+xx];n++}}
      grid[y*gw+x]=s/n;
    }
  }
  for(let y=0;y<h;y++){
    const fy=y/step,gy0=Math.min(gh-2,fy|0),wy=fy-gy0,r0=gy0*gw,r1=(gy0+1)*gw,rowOff=y*w;
    for(let x=0;x<w;x++){
      const fx=x/step,gx0=Math.min(gw-2,fx|0),wx=fx-gx0;
      const bg=(grid[r0+gx0]*(1-wx)+grid[r0+gx0+1]*wx)*(1-wy)+(grid[r1+gx0]*(1-wx)+grid[r1+gx0+1]*wx)*wy;
      const j=rowOff+x,i=j*4;
      let v=((lum[j]-inkBoost[j]*0.55)/Math.max(55,bg))*255;
      if(v>=205)v=255;
      else if(v<=165)v=Math.max(0,v*0.62);
      else v=((v-165)/40)*153+102;
      d[i]=d[i+1]=d[i+2]=v<0?0:v>255?255:v;
    }
  }
  ctx.putImageData(img,0,0);
}

function suppressStrikethrough(c){
  const ctx=c.getContext('2d',{willReadFrequently:true}),w=c.width,h=c.height,img=ctx.getImageData(0,0,w,h),d=img.data;
  const dark=new Uint8Array(w*h);
  for(let i=0,j=0;j<dark.length;i+=4,j++)dark[j]=d[i]<165?1:0;
  for(let y=10;y<h-10;y++){
    const row=y*w;let run=0;
    for(let x=0;x<=w;x++){
      const isInk=x<w&&(dark[row+x]||dark[row-w+x]||dark[row+w+x]);
      if(isInk){run++;continue}
      if(run>=50){
        const x0=x-run,x1=x-1;
        let above=0,below=0,samples=0;
        for(let xx=x0+4;xx<=x1-4;xx+=2){
          samples++;
          let hasUp=0,hasDn=0;
          for(let dy=4;dy<=12;dy++){if(dark[(y-dy)*w+xx])hasUp=1;if(dark[(y+dy)*w+xx])hasDn=1}
          if(hasUp)above++;if(hasDn)below++;
        }
        if(samples>6&&above/samples>=0.32&&below/samples>=0.32){
          const yTop=Math.max(0,y-18),yBot=Math.min(h-1,y+18);
          for(let yy=yTop;yy<=yBot;yy++){
            for(let xx=Math.max(0,x0-6);xx<=Math.min(w-1,x1+6);xx++){
              const idx=(yy*w+xx)*4;d[idx]=d[idx+1]=d[idx+2]=255;dark[yy*w+xx]=0;
            }
          }
        }
      }
      run=0;
    }
  }
  ctx.putImageData(img,0,0);
}

function tightInkCropAndThicken(c){
  const ctx=c.getContext('2d',{willReadFrequently:true}),w=c.width,h=c.height,img=ctx.getImageData(0,0,w,h),d=img.data;
  let x0=w,y0=h,x1=0,y1=0,inkCnt=0;
  for(let y=4;y<h-4;y++){
    const row=y*w;
    for(let x=4;x<w-4;x++){
      if(d[(row+x)*4]<170){
        inkCnt++;
        if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
      }
    }
  }
  if(inkCnt<30||x1<=x0||y1<=y0)return c;
  const pad=24,cw=Math.min(w,x1-x0+1),ch=Math.min(h,y1-y0+1);
  const out=document.createElement('canvas');
  out.width=cw+pad*2;out.height=ch+pad*2;
  const octx=out.getContext('2d',{willReadFrequently:true});
  octx.fillStyle='#fff';octx.fillRect(0,0,out.width,out.height);
  octx.drawImage(c,x0,y0,cw,ch,pad,pad,cw,ch);

  const ow=out.width,oh=out.height,oimg=octx.getImageData(0,0,ow,oh),od=oimg.data;
  const src=new Uint8Array(ow*oh);
  for(let i=0,j=0;j<src.length;i+=4,j++)src[j]=od[i];
  for(let y=1;y<oh-1;y++){
    const r=y*ow;
    for(let x=1;x<ow-1;x++){
      const j=r+x,v0=src[j];
      if(v0>225)continue;
      const mn=Math.min(src[j-1],src[j+1],src[j-ow],src[j+ow]);
      const v=Math.min(v0,Math.round(v0*0.45+mn*0.55));
      const idx=j*4;od[idx]=od[idx+1]=od[idx+2]=v;
    }
  }
  octx.putImageData(oimg,0,0);
  return out;
}

function wordsToLines(words){
  if(!Array.isArray(words)||!words.length)return{full:'',seller:''};
  const clean=words.filter(w=>{
    const tx=(w.text||'').trim();
    if(!tx)return false;
    if(!/\d/.test(tx)&&w.confidence<20)return false;
    if(tx.length===1&&!/[0-9₹+\/@]/.test(tx)&&w.confidence<55)return false;
    return true;
  }).map(w=>{
    const b=w.bbox;
    return{text:w.text.trim(),x0:b.x0,x1:b.x1,y0:b.y0,y1:b.y1,cy:(b.y0+b.y1)/2,h:Math.max(8,b.y1-b.y0)};
  });
  if(!clean.length)return{full:'',seller:''};
  const maxX=Math.max(...clean.map(w=>w.x1))||1;
  const maxY=Math.max(...clean.map(w=>w.y1))||1;
  const medH=clean.map(w=>w.h).sort((a,b)=>a-b)[Math.floor(clean.length/2)]||20;
  const tol=Math.max(11,medH*0.58);

  const cluster=list=>{
    const rows=[];
    [...list].sort((a,b)=>a.cy-b.cy).forEach(w=>{
      let best=null,bd=tol;
      for(const r of rows){const d=Math.abs(w.cy-r.cy);if(d<=bd){bd=d;best=r}}
      if(best){best.words.push(w);best.cy=best.words.reduce((s,x)=>s+x.cy,0)/best.words.length}
      else rows.push({cy:w.cy,words:[w]});
    });
    return rows.sort((a,b)=>a.cy-b.cy).map(r=>r.words.sort((a,b)=>a.x0-b.x0).map(w=>w.text).join(' ')).join('\n');
  };

  const sellerWords=clean.filter(w=>w.cy<maxY*0.36&&w.x0<maxX*0.56);
  return{full:cluster(clean),seller:cluster(sellerWords)};
}

async function prep(f){
  const im=await createImageBitmap(f),W=im.width,H=im.height;
  const rawC=document.createElement('canvas');rawC.width=W;rawC.height=H;
  rawC.getContext('2d').drawImage(im,0,0);if(im.close)im.close();
  const oriented=autoOrientCanvas(rawC),OW=oriented.width,OH=oriented.height;
  const k=260/Math.max(OW,OH),sw=Math.max(8,Math.round(OW*k)),sh=Math.max(8,Math.round(OH*k));
  const sc=document.createElement('canvas');sc.width=sw;sc.height=sh;
  const sx=sc.getContext('2d',{willReadFrequently:true});sx.drawImage(oriented,0,0,sw,sh);
  const d=sx.getImageData(0,0,sw,sh).data,g=new Uint8Array(sw*sh);
  for(let i=0;i<g.length;i++)g[i]=(d[i*4]*299+d[i*4+1]*587+d[i+2]*114)/1000;
  const b=paperBox(g,sw,sh);let x=0,y=0,w=OW,h=OH;
  if(b){const mx=OW*.015,my=OH*.015;x=Math.max(0,Math.floor(b[0]/k-mx));y=Math.max(0,Math.floor(b[1]/k-my));w=Math.min(OW-x,Math.ceil((b[2]-b[0])/k+2*mx));h=Math.min(OH-y,Math.ceil((b[3]-b[1])/k+2*my))}
  const s=Math.min(3200/Math.max(w,h),Math.max(.35,Math.min(1.6,1350/w))),pad=18,c=document.createElement('canvas');
  c.width=Math.round(w*s)+pad*2;c.height=Math.round(h*s)+pad*2;
  const cx=c.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,c.width,c.height);cx.drawImage(oriented,x,y,w,h,pad,pad,Math.round(w*s),Math.round(h*s));
  unstamp(c);
  const ocrCanvas=document.createElement('canvas');ocrCanvas.width=c.width;ocrCanvas.height=c.height;ocrCanvas.getContext('2d').drawImage(c,0,0);
  flattenPaper(ocrCanvas);
  suppressStrikethrough(ocrCanvas);
  return{clean:c,ocr:tightInkCropAndThicken(ocrCanvas)};
}
function stampMask(p,w,h){const m=new Uint8Array(w*h);for(let i=0,j=0;j<m.length;i+=4,j++){const r=p[i],g=p[i+1],b=p[i+2],mx=Math.max(r,g,b);if(mx<=60||b!==mx)continue;const mn=Math.min(r,g,b);if((mx-mn)*255/mx>60&&b-g>25)m[j]=1}

async function ocr(f){
  if(ocrScanning)return toast('Already scanning a receipt…');
  if(!window.Tesseract){photo(f);return toast('OCR engine not loaded. Connect once to cache it.')}

    t.width=clean.width*q;t.height=clean.height*q;t.getContext('2d').drawImage(clean,0,0,t.width,t.height);
    S.img=t.toDataURL('image/jpeg',.72);S.bid=null;ph();
    TW=TW||await Tesseract.createWorker('eng',1,{logger:m=>{if(ocrScanning)busy('OCR Engine: '+m.status,20+Math.round((m.progress||0)*42))}});
    if(ocrAbort)throw new Error('cancelled');
    let best=null,bt='';const rsl=[];
    const passes=[[1,6,'Reading invoice table & store header…',66],[1.38,4,'Aligning multi-column fields…',82],[1.25,11,'Scanning sparse & handwritten lines…',94]];
    for(const[k,psm,msg,pct]of passes){
      if(ocrAbort)throw new Error('cancelled');
      let cc=oc;
      if(k!==1){cc=document.createElement('canvas');cc.width=Math.round(oc.width*k);cc.height=Math.round(oc.height*k);cc.getContext('2d').drawImage(oc,0,0,cc.width,cc.height)}
      busy(msg,pct);
      const {raw,spatial,seller}=await pass(cc,psm);
      for(const candidateText of [spatial,raw]){
        if(!candidateText.trim())continue;
        const r=billParse(candidateText,seller),sm=r.items.reduce((s,i)=>s+i.amount,0);
        const metaBonus=(r.merchant?2:0)+(r.gstin||r.pan?3:0)+(r.tax?1:0);
        const sc=(r.total?-Math.abs(sm-r.total)*8:0)+r.items.length*3+metaBonus;
        rsl.push(r);
        if(!best||(r.items.length&&sc>best.sc)){best={r,sc};bt=candidateText}
      }
      if(best&&best.r.items.length>=2&&best.r.total&&Math.abs(best.r.items.reduce((s,i)=>s+i.amount,0)-best.r.total)<1.5)break;
    }
    if(ocrAbort)throw new Error('cancelled');
    if(best&&best.r.total&&Math.abs(best.r.items.reduce((s,i)=>s+i.amount,0)-best.r.total)>=1)consensus(rsl,best.r);
    ocrScanning=false;ph();busy('',0);
    const t0=$('#sm');if(t0)t0.value=bt.trim();
    R=best?best.r:null;
    if(R&&(R.items.length||R.total>0)){R.src='scan';toast('Extracted '+R.items.length+' item'+(R.items.length===1?'':'s')+' ✓')}
    else{R=null;toast('No clear items found. Edit the OCR text above & tap Read ✨')}
    rv();
  }catch(e){
    ocrScanning=false;ph();busy('',0);
    if(String(e.message||e)==='cancelled')toast('Scan cancelled');
    else{try{if(TW)await TW.terminate()}catch(_){}TW=null;toast('OCR error — please try a clearer photo')}
  }
}

function consensus(rs,b){const same=rs.filter(r=>r.items.length===b.items.length);if(same.length>1){b.items.forEach((it,k)=>{const v={};same.forEach(r=>{const a=r.items[k].amount;v[a]=(v[a]||0)+1});const al=Object.keys(v).map(Number);it.alts=[...new Set([...(it.alts||[]),...al])];const tp=al.sort((x,y)=>v[y]-v[x])[0];if(v[tp]>=2&&v[tp]>(v[it.amount]||0))it.amount=tp})}if(b.total)fixSum(b.items,b.total)}
function trimS(au){const f=320,n=Math.floor(au.length/f),e=[];let mx=0;for(let i=0;i<n;i++){let s=0;for(let j=0;j<f;j++){const v=au[i*f+j];s+=v*v}e[i]=Math.sqrt(s/f);if(e[i]>mx)mx=e[i]}const th=mx*.06;let a=0,z=n-1;while(a<n&&e[a]<th)a++;while(z>a&&e[z]<th)z--;a=Math.max(0,a-10);z=Math.min(n-1,z+10);return z-a<5?au:au.slice(a*f,(z+1)*f)}
let ASR={},rc=null,rt=null,wb=0;
function segs(au){const f=320,n=Math.floor(au.length/f);if(n<10)return[];const e=new Float32Array(n);let mx=0;for(let i=0;i<n;i++){let s=0;for(let j=0;j<f;j++){const v=au[i*f+j];s+=v*v}e[i]=Math.sqrt(s/f);if(e[i]>mx)mx=e[i]}
const th=Math.max(mx*.08,.004),G=40,MX=1250,out=[];let s0=-1,gap=0;
for(let i=0;i<n;i++){if(e[i]>=th){if(s0<0)s0=i;gap=0}else if(s0>=0){gap++;if(gap>=G){out.push([s0,i-gap]);s0=-1;gap=0}}if(s0>=0&&i-s0>=MX){out.push([s0,i]);s0=-1;gap=0}}
if(s0>=0)out.push([s0,Math.max(s0+1,n-1-gap)]);
const m=[];for(const s of out){const p=m[m.length-1];if(p&&s[1]-s[0]<25&&s[0]-p[1]<75)p[1]=s[1];else if(s[1]-s[0]>=8)m.push([s[0],s[1]])}
return m.map(([a,b])=>au.slice(Math.max(0,a-15)*f,(Math.min(n-1,b+15)+1)*f))}
async function loadAsr(){const mn=($('#vm')||{}).value==='small'?'small':'base';if(ASR[mn])return ASR[mn];busy('Loading Whisper '+mn+' model (cached after 1st use)…',15);const{pipeline,env}=await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2');env.allowLocalModels=false;ASR[mn]=await pipeline('automatic-speech-recognition','Xenova/whisper-'+mn,{progress_callback:p=>{if(p.status==='progress')busy('Downloading Whisper '+mn+' '+Math.round(p.progress)+'%',Math.round(p.progress))}});return ASR[mn]}
const mb=(on,s)=>{const b=$('#mic');if(b){b.classList.toggle('on',!!on);b.textContent=on?'⏹ Tap to stop · '+(s||0)+'s':t('add.speak')}};
const HAL=/^\W*(thank(s| you)( for watching)?|you|bye|subtitles by.*|please subscribe)\W*$/i;
const normSp=t=>t.replace(/\bk\.?\s?g\.?s?\b/gi,' kg ').replace(/\bkay\s*gee\b/gi,' kg ').replace(/[ \t]+/g,' ');
const dedupe=t=>t.split(/\n|(?<=[.!?])\s+/).filter((s,i,a)=>s.trim()&&(i===0||s.trim().toLowerCase()!==a[i-1].trim().toLowerCase())).join('\n');
async function transcribe(a,au){const o={language:$('#vl').value==='hi-IN'?'hindi':'english',task:'transcribe',chunk_length_s:30,stride_length_s:5},run=async x=>{try{return(await a(x,{...o,num_beams:3})).text||''}catch(e){return(await a(x,o)).text||''}},P=segs(au);if(!P.length)return'';const out=[];
for(let i=0;i<P.length;i++){busy('Transcribing segment '+(i+1)+' of '+P.length+'…',Math.round(((i+1)/P.length)*100));const tx=(await run(P[i])).trim();if(tx&&!HAL.test(tx))out.push(tx)}return out.join('\n')}
async function mic(){
  const mode=($('#vm')||{}).value||'instant';
  if(mode==='instant')return micWeb();
  if(rc){rc.stop();return}
  if(wb)return toast('Still finishing the last recording…');
  if(!navigator.mediaDevices||!window.MediaRecorder)return micWeb();
  let st;try{st=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:true}})}catch(e){return toast('Mic is blocked. Allow microphone access for this page.')}
  startEq(st);
  const ch=[],t0=Date.now(),AC=window.AudioContext||window.webkitAudioContext;let ac0=null,heard=0,last=Date.now(),lvl=0;
  try{ac0=new AC();const an=ac0.createAnalyser();an.fftSize=1024;ac0.createMediaStreamSource(st).connect(an);const bf=new Float32Array(an.fftSize);rt=setInterval(()=>{an.getFloatTimeDomainData(bf);let s=0;for(let i=0;i<bf.length;i++)s+=bf[i]*bf[i];const r=Math.sqrt(s/bf.length);if(r>lvl)lvl=r;if(r>.02){heard=1;last=Date.now()}mb(1,Math.round((Date.now()-t0)/1000));if(rc&&((heard&&Date.now()-last>3500)||Date.now()-t0>150000))rc.stop()},150)}catch(e){rt=setInterval(()=>mb(1,Math.round((Date.now()-t0)/1000)),500)}
  rc=new MediaRecorder(st);rc.ondataavailable=e=>{if(e.data.size)ch.push(e.data)};
  rc.onstop=async()=>{clearInterval(rt);if(ac0)try{ac0.close()}catch(e){}stopEq();st.getTracks().forEach(t=>t.stop());rc=null;mb(0);wb=1;
  try{if(Date.now()-t0<700)throw new Error('short');if(lvl&&lvl<.012)throw new Error('quiet');
  const ac=new AC({sampleRate:16000});let au=(await ac.decodeAudioData(await new Blob(ch).arrayBuffer())).getChannelData(0);ac.close();
  let pk=0;for(let i=0;i<au.length;i++){const v=Math.abs(au[i]);if(v>pk)pk=v}if(pk>0&&pk<.6){const g=.9/pk;au=au.map(v=>v*g)}
  const a=await loadAsr(),raw=await transcribe(a,au);busy('',0);const tx=normSp(dedupe(raw)).trim();
  if(!tx||HAL.test(tx)){toast('Did not catch that. Speak closer to the mic and try again.');return}
  const t=$('#sm');t.value=(t.value?t.value+'\n':'')+tx;read(t.value)}
  catch(e){busy('',0);const m=String(e.message||e);if(m==='short')toast('Too short. Tap Speak, talk, then tap Stop.');else if(m==='quiet')toast('Mic too quiet. Speak louder or closer.');else{toast('Offline Whisper unavailable — using Instant Voice.');micWeb()}}
  finally{wb=0}};
  rc.start();mb(1,0);
}

/* UI Motion Controllers */
function syncPills(){
  const navBtns=[...document.querySelectorAll('nav button')],navPill=$('#nav-pill');
  const activeNav=navBtns.find(b=>b.dataset.v===S.tab);
  if(activeNav&&navPill){
    navPill.style.width=activeNav.offsetWidth+'px';
    navPill.style.transform=`translateX(${activeNav.offsetLeft-5}px)`;
  }
  document.querySelectorAll('.seg').forEach(seg=>{
    const pill=seg.querySelector('.seg-pill'),on=seg.querySelector('button.on');
    if(pill&&on){
      pill.style.width=on.offsetWidth+'px';
      pill.style.transform=`translateX(${on.offsetLeft-4}px)`;
    }
  });
}
function runCountUps(){
  document.querySelectorAll('.countup').forEach(el=>{
    const target=Number(el.dataset.target||0);
    if(!target)return;
    const dur=480,t0=performance.now();
    const step=now=>{
      const p=Math.min(1,(now-t0)/dur),ease=1-Math.pow(1-p,3);
      el.textContent=rs(Math.round(target*ease));
      if(p<1)requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}
function syncNavLabels(){
  ['home','add','items','hist'].forEach(k=>{const el=$('#nav-'+k);if(el)el.textContent=t('nav.'+k)});
}
function render(){
  syncNavLabels();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.tab));
  $('#app').innerHTML=head()+({home,add,items:itemsView,hist}[S.tab])();
  if(S.tab==='add'){rv();ph()}
  requestAnimationFrame(()=>{syncPills();runCountUps()});
}
window.addEventListener('resize',syncPills);

document.addEventListener('pointermove',e=>{
  const c=e.target.closest('.card');
  if(c){
    const r=c.getBoundingClientRect();
    c.style.setProperty('--mx',(e.clientX-r.left)+'px');
    c.style.setProperty('--my',(e.clientY-r.top)+'px');
  }
  const v=e.target.closest('#vault-card');
  if(v){
    const r=v.getBoundingClientRect(),nx=(e.clientX-r.left)/r.width-.5,ny=(e.clientY-r.top)/r.height-.5;
    v.style.setProperty('--rx',(-ny*11).toFixed(2)+'deg');
    v.style.setProperty('--ry',(nx*13).toFixed(2)+'deg');
    v.style.setProperty('--gx',((nx+.5)*100).toFixed(1)+'%');
    v.style.setProperty('--gy',((ny+.5)*100).toFixed(1)+'%');
  }
},{passive:true});
document.addEventListener('pointerleave',e=>{
  const v=$('#vault-card');
  if(v&&!v.contains(e.target)){
    v.style.setProperty('--rx','0deg');
    v.style.setProperty('--ry','0deg');
  }
},true);
document.addEventListener('pointerover',e=>{
  const el=e.target.closest('[data-sync]');
  if(!el)return;
  const k=el.dataset.sync;
  document.querySelectorAll(`[data-sync="${CSS.escape(k)}"]`).forEach(n=>n.classList.add('hl-sync'));
});
document.addEventListener('pointerout',e=>{
  const el=e.target.closest('[data-sync]');
  if(!el)return;
  const k=el.dataset.sync;
  document.querySelectorAll(`[data-sync="${CSS.escape(k)}"]`).forEach(n=>n.classList.remove('hl-sync'));
});

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
if(a==='tab'){S.tab=v;if(v==='home')S.cd='';render()}
else if(a==='mo'){const[y,m]=S.m.split('-').map(Number),d=new Date(y,m-1+ +v,1);S.m=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');render()}
else if(a==='lang'){const idx=I18N_TOC.supported.indexOf(S.lang);S.lang=I18N_TOC.supported[(idx+1)%I18N_TOC.supported.length];S.hi=S.lang==='hi';try{localStorage.setItem('km_lang',S.lang);localStorage.setItem('km_hi',S.hi?'1':'0')}catch(e){}render()}
else if(a==='theme'){applyTheme(isDark()?'light':'dark');render()}
else if(a==='sample'){const t=$('#sm');if(t){t.value=v;t.focus();read(v)}}
else if(a==='ocr-stop'){ocrAbort=true}
else if(a==='ty'){S.ty=v;S.pick=0;render()}
else if(a==='rm'){ask('Delete this entry?',()=>{rm(v);render()})}else if(a==='ed')edit(v);else if(a==='et'){const o=$('#ov');o.dataset.t=v;o.querySelectorAll('[data-a=et]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));syncPills();$('#ec').innerHTML=opts(guess($('#en').value,v),v)}else if(a==='es')editSave(v);else if(a==='edl'){ask('Delete this entry?',()=>{rm(v);$('#ov').remove();render()})}else if(a==='no'){}else if(a==='pc'){S.cd=v;render()}else if(a==='cb'){S.cd='';render()}else if(a==='pv'){S.pv=v;render()}else if(a==='it'){if(v!=='__o'){S.tab='items';S.iq=v;S.iqs='';render()}}else if(a==='ir'){S.ir=v;render()}else if(a==='iq'){S.iq=v;S.iqs='';render()}else if(a==='ic'){S.iq='';S.iqs='';render()}else if(a==='hq'){S.q=v;const qi=$('#q');if(qi)qi.value=v;$('#hl').innerHTML=hl()}else if(a==='ntpick'){const ni=$('#nt');if(ni){ni.value=v;if(!S.pick)$('#ct').value=catGuess(v,S.ty);const tr=$('#nt-tray');if(tr)tr.innerHTML=''}}else if(a==='clr'){R=null;busyMsg='';busyPct=0;S.img=null;S.bid=null;S.pick=0;render();toast('Cleared')}else if(a==='wipe'){const n=S.tx.length;if(!n)toast('Nothing to delete');else ask('Delete ALL '+n+' saved entries and their bill photos? This cannot be undone. Tip: use 💾 Backup in History first.',()=>{S.tx=[];cache();try{idb().then(d=>{d.transaction('i','readwrite').objectStore('i').clear()}).catch(()=>{})}catch(e){}IKM.clear();S.cd='';S.iq='';render();toast('All entries deleted')})}
else if(a==='sv')save();
else if(a==='rd')read($('#sm').value.trim());
else if(a==='mic')mic();else if(a==='bk'){DL?DL.save({filename:'kharchamitra-backup.json',data:JSON.stringify(S.tx)}).catch(()=>{}):toast('Backup not available here')}else if(a==='px'){S.img=null;S.bid=null;ph()}else if(a==='vi')viewBill(v);else if(a==='cl')$('#ov').remove()
else if(a==='rx'){R.items.splice(+v,1);(R.items.length||(+R.total||0)>0)?rv():(R=null,rv())}
else if(a==='rs')saveR();else if(a==='rc'){R=null;rv()}else if(a==='ex')exportCsv()});

document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.i!==undefined){
    R.items[t.dataset.i][t.dataset.k]=t.dataset.k==='amount'?+t.value:t.value;
  }else if(t.dataset.m){
    const k=t.dataset.m==='1'?'merchant':t.dataset.m;
    R[k]=(k==='tax'||k==='total')?(+t.value||0):t.value;
  }else if(t.id==='nt'){
    if(!S.pick)$('#ct').value=catGuess(t.value,S.ty);
    const tr=$('#nt-tray');
    if(tr)tr.innerHTML=t.value.trim()?renderAdaptiveTray(adaptivePredict(t.value,S.tx),'ntpick'):'';
  }else if(t.id==='iqi'){
    S.iqs=t.value;S.iq='';$('#ires').innerHTML=itemRes();
  }else if(t.id==='q'){
    S.q=t.value;$('#hl').innerHTML=hl();
  }
});

document.addEventListener('change',e=>{if(e.target.id==='ct')S.pick=1;const f=e.target.files&&e.target.files[0];if(f&&e.target.id==='rs'){f.text().then(s=>{try{const a=JSON.parse(s);a.forEach(x=>x&&x.id&&put(x));render();toast('Restored '+a.length)}catch(_){toast('Not a valid backup')}});e.target.value=''}else if(f&&e.target.type==='file'){ocr(f);e.target.value=''}});
render();
(async()=>{try{DL=await claude.use('downloads')}catch(e){}return;try{const u=await claude.use('user'),db=await claude.use('db');if(u&&db){const id=await u.id();coll=db.collection('data/users/'+id);let first=1;coll.onSnapshot(s=>{const docs=s.docs.map(d=>d.data());if(first){first=0;const ids=new Set(docs.map(d=>d.id));S.tx.filter(x=>!ids.has(x.id)).forEach(x=>{docs.push(x);coll.doc(x.id).set(x).catch(()=>{})})}S.tx=docs;cache();if(S.tab!=='add')render()},()=>{})}}catch(e){}
try{SM=await claude.use('sample')}catch(e){}
try{D=await claude.use('dictation');if(D){D.onFinal(({text})=>{const t=$('#sm');if(t)t.value+=(t.value?' ':'')+text});D.onState(({state})=>{listening=state==='listening';const m=$('#mic');if(m)m.classList.toggle('on',listening)})}}catch(e){}
try{DL=await claude.use('downloads')}catch(e){}
if(S.tab!=='add')render()})();
